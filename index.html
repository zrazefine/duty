<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>График Дежурства</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#000;
    --surface:rgba(255,255,255,.055); --surface2:rgba(255,255,255,.11);
    --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.16);
    --glass:rgba(255,255,255,.04); --glass-bd:rgba(255,255,255,.12);
    --glass-blur:blur(6px) saturate(120%);
    --pop:rgba(8,10,11,.75); --pop-blur:blur(16px) saturate(130%);
    --text:#fff; --text-muted:#6b6b6f; --text-dim:#9d9da1; --cream:#f1ece1;
    --green:#f2f2f2; --red:#e8102c; --red-dim:rgba(232,16,44,.5);
    --ice:#7fd8ef; --ice-dim:rgba(127,216,239,.5);
    --r-lg:10px; --r-md:6px; --r-sm:3px;
    --font-display:'Archivo Black', 'Helvetica Neue', Arial, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
    min-height:100vh;font-size:14px;
    padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
    padding-top:env(safe-area-inset-top,0px);
  }

  /* BACKGROUND — чёрный, резкий виньет, зерно, едва заметный крест-водяной знак */
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(130% 70% at 50% -5%, rgba(120,195,220,.3) 0%, rgba(6,9,11,.92) 48%, #000 80%);
  }
  #snow{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

  /* базовый вид "стекла": прозрачная подложка + размытие/насыщенность того, что за ней,
     плюс мягкий блик по верхней кромке — имитация Liquid Glass */
  .glass,
  .pass-card,.duty-list,.debtors-list,.rand-result,header,.ctx-menu,.toast{
    position:relative;
    background:var(--glass);
    border:1px solid var(--glass-bd);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  }
  .pass-card::before,.duty-list::before,.debtors-list::before,.rand-result::before,
  .ctx-menu::before{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 30%,
                rgba(255,255,255,0) 68%, rgba(255,255,255,.05) 100%);
    mix-blend-mode:overlay;
  }

  /* ACCESS GATE */
  #gate{
    position:fixed;inset:0;z-index:9999;overflow:hidden;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .pass-card{
    width:100%;max-width:320px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:34px 22px 28px;text-align:center;
    border-radius:var(--r-lg);
    box-shadow:0 24px 70px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .pass-badge{
    width:46px;height:46px;border-radius:var(--r-sm);
    border:1px solid var(--border2);background:transparent;
    display:flex;align-items:center;justify-content:center;margin-bottom:2px;
  }
  .pass-badge svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
  .pass-badge.bad{border-color:var(--red);background:rgba(232,16,44,.1)}
  .pass-badge.bad svg{stroke:var(--red)}
  #gate h1{font-family:var(--font-display);font-size:21px;font-weight:400;letter-spacing:0;line-height:1.15;text-transform:uppercase;color:var(--cream);font-style:normal}
  #gate p{font-size:13px;color:var(--text-dim);line-height:1.45}
  #gateId{font-family:monospace;font-size:12px;color:var(--text-muted);letter-spacing:1px;margin-top:2px}
  #gateId.big{
    font-size:20px;color:var(--text);letter-spacing:2px;padding:10px 14px;
    border:1px solid var(--border2);border-radius:var(--r-sm);background:transparent;
    user-select:all;-webkit-user-select:all;
  }

  /* MAIN */
  #mainApp{display:none;position:relative;z-index:2}
  header{
    display:flex;align-items:center;padding:18px 16px 14px;
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:50;
    background:rgba(0,0,0,.72);
  }
  .hdr-title{
    font-family:var(--font-display);font-size:19px;font-weight:400;flex:1;
    letter-spacing:0;line-height:1.15;text-transform:uppercase;color:var(--cream);
  }
  .dots-btn{
    background:transparent;border:1px solid var(--border2);color:var(--text-dim);
    font-size:19px;cursor:pointer;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--r-sm);flex-shrink:0;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1),border-color .15s,color .15s;
  }
  .dots-btn:active{transform:scale(.88);border-color:var(--ice);color:var(--text)}

  .sec-label{
    font-size:10px;font-weight:600;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--text-muted);
    padding:16px 20px 8px;
  }

  .sec-row{display:flex;align-items:center}
  .sec-row .sec-label{padding-right:0}
  .copy-btn{
    background:none;border:none;color:var(--text-muted);
    width:30px;height:30px;
    margin-top:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1),color .15s;
  }
  .copy-btn:active{transform:scale(.85);color:var(--text)}
  .copy-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* DUTY LIST */
  .duty-list,.debtors-list{
    display:flex;flex-direction:column;margin:0 14px;overflow:hidden;
    border-radius:var(--r-lg);
    box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .duty-item:last-child,.debtor-item:last-child{border-bottom:none}
  .duty-item{
    display:flex;align-items:center;padding:0 14px;
    border-bottom:1px solid var(--border);min-height:64px;gap:10px;
  }
  .duty-num{font-size:11px;color:var(--text-muted);min-width:18px;text-align:right}
  .duty-names{flex:1;display:flex;flex-direction:column;gap:5px}
  .person-row{display:flex;align-items:center;gap:7px}
  .person-name{font-size:14px;flex:1}
  .person-count{
    font-size:12px;font-weight:600;color:var(--text-muted);min-width:34px;text-align:center;font-family:monospace;
    background:transparent;border:1px solid var(--border2);border-radius:var(--r-sm);padding:4px 8px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s cubic-bezier(.34,1.56,.64,1),border-color .12s;
  }
  .person-count:active{transform:scale(.9);background:rgba(255,255,255,.15)}
  .person-count.nz{color:var(--text-dim)}

  /* DEBTORS */
  .debtor-item{
    display:flex;align-items:center;padding:11px 14px;
    border-bottom:1px solid var(--border);gap:10px;
  }
  .debtor-name{flex:1;font-size:14px;color:var(--red)}
  .debtor-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
  .empty-msg{padding:14px 14px;font-size:13px;color:var(--text-muted)}

  /* RAND — белое стекло (акцентная кнопка) */
  .rand-wrap{padding:14px}
  .rand-btn{
    width:100%;color:#fff;cursor:pointer;
    border:1px solid var(--ice);
    border-radius:var(--r-sm);
    background:rgba(127,216,239,.08);
    padding:14px;font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s;
  }
  .rand-btn:active{transform:scale(.97);background:rgba(127,216,239,.22)}
  .rand-btn:disabled{opacity:.5;cursor:default;transform:none}
  .rand-result{
    margin-top:10px;overflow:hidden;
    border-radius:var(--r-lg);padding:18px 14px 16px;
    box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07);
    display:none;flex-direction:column;align-items:center;text-align:center;
  }
  .rand-result.show{display:flex;animation:rrIn .3s ease-out}
  .rand-result.done{border-color:var(--ice-dim);animation:ringPulse .9s ease-out}
  .rr-label{font-size:10px;color:var(--text-muted);letter-spacing:1.6px;text-transform:uppercase}
  .rr-reel{height:46px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:10px 0 4px}
  .rr-name{font-family:var(--font-display);font-size:26px;font-weight:400;letter-spacing:0;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  .rr-name.tick{animation:tick 120ms ease-out}
  .rr-name.land{color:var(--cream);text-shadow:0 0 22px rgba(127,216,239,.6);animation:land .6s cubic-bezier(.34,1.56,.64,1)}
  .rr-sub{font-size:12px;color:var(--text-muted);min-height:16px;opacity:0;transition:opacity .4s}
  .rr-sub.in{opacity:1}
  .rr-close{
    position:absolute;top:8px;right:8px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:var(--text-muted);font-size:15px;
    cursor:pointer;width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s;
  }
  .rr-close:active{transform:scale(.88);background:rgba(255,255,255,.18)}
  .burst{position:absolute;inset:0;pointer-events:none}
  .spark{
    position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;
    animation:spark .8s ease-out forwards;
  }
  @keyframes rrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes tick{from{transform:translateY(-55%);opacity:0;filter:blur(2px)}to{transform:none;opacity:1;filter:none}}
  @keyframes land{0%{transform:scale(.8);opacity:.3}55%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
  @keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(127,216,239,.4)}100%{box-shadow:0 0 0 18px rgba(127,216,239,0)}}
  @keyframes spark{
    from{transform:translate(-50%,-50%) scale(1);opacity:1}
    to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}
  }

  /* OVERLAY */
  .overlay{position:fixed;inset:0;z-index:200;display:none}
  .overlay.active{display:block}
  .ov-bd{position:absolute;inset:0;background:rgba(3,4,8,.5)}
  .ctx-menu{
    position:absolute;background:var(--pop);
    -webkit-backdrop-filter:var(--pop-blur);backdrop-filter:var(--pop-blur);
    border:1px solid var(--border2);border-radius:var(--r-md);
    min-width:210px;box-shadow:0 10px 44px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.07);
    overflow:hidden;
    transform:scale(.85);opacity:0;transform-origin:top right;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),opacity .12s;
  }
  .ctx-menu.open{transform:scale(1);opacity:1}
  .ctx-hdr{
    padding:10px 13px 8px;font-size:10px;font-weight:600;
    letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);
    border-bottom:1px solid var(--border);
  }
  .ctx-item{
    padding:11px 13px;font-size:14px;cursor:pointer;
    display:flex;align-items:center;gap:10px;color:var(--text);
    border-bottom:1px solid var(--border);transition:background .12s;
  }
  .ctx-item:last-child{border-bottom:none}
  .ctx-item:active{background:rgba(255,255,255,.1)}
  .ctx-item.green{color:var(--green)}
  .ctx-item.red{color:var(--red)}
  .sub-list{background:rgba(255,255,255,.04);display:none;flex-direction:column}
  .sub-list.open{display:flex}
  .sub-item{
    padding:10px 13px 10px 24px;font-size:13px;color:var(--text-dim);
    cursor:pointer;border-bottom:1px solid var(--border);
    transition:background .12s;
  }
  .sub-item:last-child{border-bottom:none}
  .sub-item:active{background:rgba(255,255,255,.1)}

  /* PAIR MENU ROWS */
  .ctx-menu.wide{min-width:272px}
  .p-row{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 13px;border-bottom:1px solid var(--border)}
  .p-row:last-child{border-bottom:none}
  .p-name{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-cnt{font-size:12px;font-family:monospace;color:var(--text-dim);min-width:22px;text-align:center}
  .p-btn{
    width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--border2);background:transparent;
    color:var(--text);font-size:18px;line-height:1;cursor:pointer;touch-action:manipulation;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .12s cubic-bezier(.34,1.56,.64,1),background .12s;
  }
  .p-btn:active{transform:scale(.88);background:rgba(255,255,255,.16)}
  .p-btn.plus{color:var(--green)}
  .p-btn.x{color:var(--red)}

.sec-link{cursor:pointer;touch-action:manipulation;transition:color .15s}
  .sec-link:active{color:var(--text)}
  .duty-num{position:relative}
  .duty-num .nd{position:relative;display:inline-block}
  .duty-num .chk{position:absolute;right:calc(100% + 3px);top:50%;transform:translateY(-50%);font-size:10px;line-height:1;color:inherit;animation:chkIn .22s cubic-bezier(.34,1.56,.64,1)}
  @keyframes chkIn{from{transform:translateY(-50%) scale(.3);opacity:0}to{transform:translateY(-50%) scale(1);opacity:1}}
  .l-wrap{padding:10px 13px 12px;display:flex;flex-direction:column;gap:10px}
  .l-input{
    width:100%;font-size:16px;padding:10px 12px;background:rgba(0,0,0,.5);border:1px solid var(--border2);
    border-radius:var(--r-sm);outline:none;color:var(--text);font-family:monospace;text-align:center;
  }
  .l-del{
    width:100%;padding:10px;border-radius:var(--r-sm);border:1px solid var(--red-dim);background:rgba(232,16,44,.08);
    color:var(--red);font-size:14px;cursor:pointer;touch-action:manipulation;
    transition:transform .12s cubic-bezier(.34,1.56,.64,1),background .12s;
  }
  .l-del:active{transform:scale(.96);background:rgba(232,16,44,.18)}

  /* TOAST */
  /* JOURNAL */
  .j-list{max-height:114px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .j-row{height:38px;line-height:18px;padding:10px 13px;font-size:13px;font-family:monospace;color:var(--text-dim);border-bottom:1px solid var(--border);white-space:nowrap}
  .j-row:last-child{border-bottom:none}
  .j-row.last{box-shadow:inset 0 0 0 1px var(--ice);background:rgba(127,216,239,.08);border-bottom-color:transparent;color:var(--text)}
  .j-row b{color:var(--text);font-weight:600}
  .j-empty{padding:12px 13px;font-size:13px;color:var(--text-muted)}

  .toast{
    position:fixed;
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    left:50%;transform:translateX(-50%) translateY(80px);
    opacity:0;visibility:hidden;
    background:var(--pop);-webkit-backdrop-filter:var(--pop-blur);backdrop-filter:var(--pop-blur);
    border:1px solid var(--border2);
    border-radius:var(--r-sm);padding:9px 18px;font-size:13px;color:var(--text);
    box-shadow:0 10px 34px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07);
    white-space:nowrap;z-index:999;pointer-events:none;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s,visibility 0s linear .25s;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s,visibility 0s}
  /* кликабельный тост (например, юзернейм → открыть профиль): обычный тост
     намеренно pointer-events:none, чтобы не перехватывать тапы под собой —
     для кликабельного включаем события и добавляем визуальную подсказку */
  .toast.clickable{pointer-events:auto;cursor:pointer;border-color:var(--ice);color:var(--ice)}
  .toast.clickable:active{transform:translateX(-50%) translateY(0) scale(.96)}

  /* GATE SLOT — форма заявки / статусные сообщения на экране входа */
  .gate-slot{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:0}
  .gate-sub{font-size:13px;color:var(--text-dim);line-height:1.45;text-align:center}
  .gate-input{
    width:100%;font-size:16px;padding:12px 14px;background:rgba(0,0,0,.5);
    border:1px solid var(--border2);border-radius:var(--r-sm);outline:none;
    color:var(--text);text-align:center;font-family:inherit;
  }
  .gate-input:focus{border-color:var(--ice)}
  .gate-submit{
    width:100%;color:#fff;cursor:pointer;border:1px solid var(--ice);border-radius:var(--r-sm);
    background:rgba(127,216,239,.08);padding:13px;font-size:12px;font-weight:600;
    letter-spacing:2px;text-transform:uppercase;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s,opacity .15s;
  }
  .gate-submit:active{transform:scale(.97);background:rgba(127,216,239,.22)}
  .gate-submit:disabled{opacity:.4;cursor:default;transform:none;border-color:var(--border2);background:transparent;color:var(--text-muted)}

  /* ПОСТРАНИЧНОЕ МЕНЮ (рассмотрение заявок / чёрный список) */
  .ctx-hdr.pg{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pg-arrows{display:flex;gap:4px;flex-shrink:0}
  .pg-arrow{
    width:24px;height:24px;border-radius:var(--r-sm);border:1px solid var(--border2);
    background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation;
    transition:transform .12s cubic-bezier(.34,1.56,.64,1),background .12s;
  }
  .pg-arrow:active{transform:scale(.88);background:rgba(255,255,255,.14)}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<!-- ACCESS GATE -->
<div id="gate">
  <div class="pass-card">
    <div class="pass-badge" id="gateBadge">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1 id="gateTitle"></h1>
    <p id="gateText"></p>
    <div id="gateId"></div>
    <div id="gateSlot" class="gate-slot"></div>
  </div>
  <audio id="gateTrack" src="track.mp3" preload="auto" playsinline></audio>
</div>

<!-- MAIN APP -->
<div id="mainApp">
  <header>
    <span class="hdr-title">График Дежурства</span>
    <button class="dots-btn" id="headerDots" onclick="openHeaderMenu(event)">⋯</button>
  </header>

  <div class="sec-row">
    <div class="sec-label sec-link" id="lastLabel" onclick="openLastMenu(event)">Список дежурных</div>
    <button class="copy-btn" onclick="copyCounts()" aria-label="Скопировать счётчики">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
    </button>
  </div>
  <div class="duty-list" id="dutyList"></div>

  <div class="sec-label">Пропустившие</div>
  <div class="debtors-list" id="debtorsList"></div>

  <div class="rand-wrap" id="randSection">
    <button class="rand-btn" id="randBtn" onclick="randomize()">Рандомайзер</button>
    <div class="rand-result" id="randResult">
      <button class="rr-close" onclick="hideRand()">✕</button>
      <div class="rr-label">Случайный пропустивший</div>
      <div class="rr-reel"><div class="rr-name" id="randName">—</div></div>
      <div class="rr-sub" id="randSub"></div>
      <div class="burst" id="randBurst"></div>
    </div>
  </div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="ov-bd" onclick="closeMenu()"></div>
  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-hdr" id="ctxHdr">ДЕЙСТВИЯ</div>
    <div id="ctxBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<audio id="easterEggTrack" src="office.mp3" preload="auto" playsinline></audio>

<!--
  ═══════════════════════════════════════════════════════════════════════════
  НАСТРОЙКА БЕСПЛАТНОГО СЕРВЕРА (Firebase Firestore) — нужно один раз:
  1. Зайди на https://console.firebase.google.com, создай проект (бесплатно).

var soundOn = (function(){
  try { var v = localStorage.getItem('duty_sound_v1'); return v === null ? true : v === '1'; }
  catch(e){ return true; }
})();
var _actx = null;
function actx(){
  if (!_actx) {
    try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
  }
  return _actx;
}
// Telegram's in-app WebView (iOS особенно) часто создаёт AudioContext в состоянии
// "suspended" и не "просыпается" от обычного resume() без явной привязки к жесту.
// Поэтому: 1) глушим контекст как можно раньше первым же касанием/кликом,
// 2) перед каждым звуком ждём, пока resume() реально завершится, и только
// потом планируем звук (иначе он тихо "проглатывается").
function ensureRunning(cb){
  var ctx = actx();
  if (!ctx) { warnNoAudio(); cb(null); return; }
  if (ctx.state === 'running') { cb(ctx); return; }
  try {
    ctx.resume().then(function(){
      if (ctx.state !== 'running') warnNoAudio();
      cb(ctx);
    }, function(){ warnNoAudio(); cb(ctx); });
  } catch(e) { warnNoAudio(); cb(ctx); }
}
function unlockAudio(){
  var ctx = actx(); if (!ctx) return;
  // немой буфер — классический трюк для разблокировки звука в WebKit/WebView
  try {
    var b = ctx.createBuffer(1, 1, 22050);
    var s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
  } catch(e) {}
  if (ctx.state === 'suspended') { try { ctx.resume(); } catch(e){} }
}
['touchstart','touchend','mousedown','pointerdown','click','keydown'].forEach(function(ev){
  document.addEventListener(ev, unlockAudio, {capture:true, passive:true});
});
function tone(o){
  if (!soundOn) return;
  ensureRunning(function(ctx){
    if (!ctx) return;
    var t0 = ctx.currentTime, dur = o.dur || 0.12;
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t0);
    if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(o.slideTo,1), t0+dur);
    var vol = o.vol != null ? o.vol : 0.1;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  });
}
function noiseBurst(o){
  if (!soundOn) return;
  ensureRunning(function(ctx){
    if (!ctx) return;
    var dur = o.dur || 0.15;
    var buf = ctx.createBuffer(1, Math.max(1,Math.round(ctx.sampleRate*dur)), ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i=0;i<data.length;i++){ data[i] = (Math.random()*2-1) * Math.pow(1-i/data.length, 2); }
    var src = ctx.createBufferSource(); src.buffer = buf;
    var filt = ctx.createBiquadFilter(); filt.type = o.filterType || 'lowpass'; filt.frequency.value = o.freq || 1200;
    var g = ctx.createGain(); g.gain.value = o.vol != null ? o.vol : 0.12;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start();
  });
}

function normalize(o) {
  if (!o || typeof o !== 'object') o = {};
  if (!o.counts || typeof o.counts !== 'object') o.counts = {};
  if (!Array.isArray(o.debtors)) o.debtors = [];
  if (!o.log || typeof o.log !== 'object') o.log = {};
  if (o.last === undefined) o.last = null; // Firestore не принимает undefined в полях документа
  // миграция старого формата записей журнала [t,n] (массив) → {t,n} (объект):
  // Firestore не поддерживает вложенные массивы, старые локальные данные могли
  // остаться в этом формате и заново ломать сохранение при первом же save()
  Object.keys(o.log).forEach(function(name){
    var arr = o.log[name];
    if (!Array.isArray(arr)) { o.log[name] = []; return; }
    o.log[name] = arr.map(function(e){
      return Array.isArray(e) ? {t:e[0], n:e[1]} : e;
    });
  });
  PAIRS.forEach(function(p){
    if (o.counts[p.a] === undefined) o.counts[p.a] = 0;
    if (o.counts[p.b] === undefined) o.counts[p.b] = 0;
  });
  return o;
}

  if (!db || _stateSyncStarted) return;

    if (!doc.exists) { if (_role === 'owner') cloudPush(); return; }

var _forceSaveBusy = false;
function forceSave() {
  if (_forceSaveBusy) return;
  S.ts = Date.now();
  persistLocal();
  clearTimeout(_ct);
  if (!db) { toast('Нет связи с сервером (Firebase не инициализирован)'); sfx.warning(); return; }

  _forceSaveBusy = true;

  var settled = false;
  var timeoutId = setTimeout(function(){
    if (settled) return;
    settled = true; _forceSaveBusy = false;
    toast('Не удалось сохранить: нет ответа от сервера');
    sfx.warning();
  }, 7000);

  appStateRef().set({counts:S.counts, debtors:S.debtors, last:S.last, log:S.log, ts:S.ts})
    .then(function(){
      if (settled) return;
      settled = true; _forceSaveBusy = false;
      clearTimeout(timeoutId);
      toast('Данные сохранены'); sfx.success();
    })
    .catch(function(err){
      if (settled) return;
      settled = true; _forceSaveBusy = false;
      clearTimeout(timeoutId);
      console.log('force save', err);
      toast('Не удалось сохранить: ' + (err && err.code ? err.code : 'ошибка')); sfx.warning();
    });
}

// ── SNOW (на всех экранах, редкий, белые точки) ──────────────────────────────
// во время проигрывания трека на gate плавно превращаются в 🤫, затем обратно
var _snowRun = false;
var startSnow = function(){};
var setEmojiMode = function(){};
(function(){
  var cv = document.getElementById('snow'); if (!cv) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx = cv.getContext('2d', {alpha:true, desynchronized:true});
  // dpr снижен до 1.5 и кадр ограничен ~30fps — главный источник тормозов был в том,
  // что canvas перерисовывался каждый кадр ПОЗАДИ стеклянных панелей с backdrop-filter,
  // а это заставляет браузер каждый раз пересчитывать размытие для всех них разом
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5), W = 0, H = 0, flakes = [], inited = false;
  var EMOJI = '🤫';
  var EMOJI_FONT = '15px sans-serif'; // фиксированный размер шрифта — не пересчитывается на каждую снежинку
  var FRAME_MS = 1000/30; // троттлинг до ~30 кадров/сек вместо безлимитных 60
  var lastT = 0;

  // 0 = снежинки, 1 = смайлики; плавный переход между состояниями во времени
  var emojiFrom = 0, emojiTarget = 0, emojiState = 0, emojiT0 = 0, emojiDur = 900;
  function ease(x){ return x<0?0:x>1?1:(1-Math.pow(1-x,3)); }
  setEmojiMode = function(target){
    emojiFrom = emojiState; emojiTarget = target; emojiT0 = performance.now();
    if (!_snowRun) startSnow();
  };

  function size(){
    // visualViewport даёт реальный видимый размер (без зоны под клавиатурой),
    // когда он доступен — это надёжнее, чем window.innerWidth/innerHeight,
    // которые в вебвью Telegram не всегда уменьшаются при открытии клавиатуры
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function mk(initial){
    return { x:Math.random()*W, y:initial?Math.random()*H:-6, r:0.8+Math.random()*1.5,
             v:0.25+Math.random()*0.55, a:0.35+Math.random()*0.55, ph:Math.random()*6.28, sw:0.2+Math.random()*0.5 };
  }
  function draw(t, dt){
    var prog = emojiDur > 0 ? (t - emojiT0) / emojiDur : 1;
    emojiState = emojiFrom + (emojiTarget - emojiFrom) * ease(prog);
    var em = emojiState;
    var step = dt / 16.6; // нормализуем скорость движения под реальный интервал кадра
    ctx.clearRect(0,0,W,H);
    var drawDots = em < 0.995, drawEmoji = em > 0.005;
    if (drawDots) ctx.fillStyle = '#fff';
    if (drawEmoji) { ctx.font = EMOJI_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; }
    for (var i=0;i<flakes.length;i++){
      var f = flakes[i];
      f.y += f.v*step; f.x += Math.sin(t/1500 + f.ph) * f.sw * 0.6 * step;
      if (f.y > H+6) { flakes[i] = f = mk(false); }
      if (drawDots) {
        ctx.globalAlpha = f.a * (1 - em);
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
      }
      if (drawEmoji) {
        ctx.globalAlpha = f.a * em;
        ctx.fillText(EMOJI, f.x, f.y);
      }
    }
    ctx.globalAlpha = 1;
  }
  function tick(t){
    if (document.hidden) { _snowRun = false; return; } // экономим батарею, пока апп свёрнут
    var dt = lastT ? (t - lastT) : FRAME_MS;
    if (dt >= FRAME_MS - 2) { // троттлинг: не рисуем чаще ~30 раз в секунду
      draw(t, Math.min(dt, 48));
      lastT = t;
    }
    requestAnimationFrame(tick);
  }
  startSnow = function(){
    if (!inited) {
      inited = true; size();
      var N = Math.round(Math.min(32, Math.max(18, W*H/12000)));
      for (var i=0;i<N;i++) flakes.push(mk(true));
      // window 'resize' сам по себе не всегда срабатывает в вебвью Telegram,
      // когда появляется клавиатура (особенно iOS) — тогда контейнер меняет
      // размер, а внутренний растровый буфер canvas остаётся старым, и браузер
      // просто растягивает картинку под новый CSS-размер (отсюда "растянутые"
      // смайлики). Подписываемся ещё и на visualViewport, и на событие
      // Telegram WebApp — это срабатывает надёжно именно при появлении/скрытии
      // клавиатуры.
      window.addEventListener('resize', size);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', size);
      }
      if (TG && TG.onEvent) {
        try { TG.onEvent('viewportChanged', size); } catch(e) {}
      }
    }
    if (!_snowRun) { _snowRun = true; lastT = 0; requestAnimationFrame(tick); }
  };
  startSnow();
})();

    notg:    ['Открой через Telegram', 'Этот график работает только внутри бота.', false],
    setup:   ['Первый запуск', 'Твой Telegram ID. Пришли его, впишу в файл, и вход заработает.', false],
    loading: ['Welcome!', '', false],
    welcome: ['Welcome!', '', false],
    pending: ['Welcome!', '', false],
    blocked: ['Welcome!', '', true]
  }[kind];
  document.getElementById('gateTitle').textContent = T[0];
  document.getElementById('gateText').textContent  = T[1];
  document.getElementById('gateText').style.display = T[1] ? '' : 'none';
  document.getElementById('gateBadge').classList.toggle('bad', T[2]);
  var idEl = document.getElementById('gateId');
  idEl.textContent = (kind === 'setup' && uid) ? String(uid) : '';
  idEl.classList.toggle('big', kind === 'setup');

  var slot = document.getElementById('gateSlot');
  slot.innerHTML = '';
  if (kind === 'loading') {
    slot.innerHTML = '<div class="gate-sub">Загрузка…</div>';
  } else if (kind === 'welcome') {
    slot.innerHTML =
      '<input id="gateNameInput" class="gate-input no-egg" type="text" placeholder="Введите свою фамилию" autocomplete="off">' +
      '<button id="gateSubmitBtn" class="gate-submit no-egg" type="button">Подать заявку</button>';
    document.getElementById('gateSubmitBtn').onclick = submitApplication;
    var gi = document.getElementById('gateNameInput');
    gi.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') submitApplication(); });
  } else if (kind === 'pending') {
    slot.innerHTML = '<div class="gate-sub">Заявка подана! Рассматривается администратором.</div>';
  } else if (kind === 'blocked') {
    slot.innerHTML =
      '<div class="gate-sub">Вход заблокирован</div>' +
      '<button class="gate-submit no-egg" type="button" disabled>Подать заявку</button>';
  }

  document.getElementById('gate').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
  // пасхалка (смайлики + музыка) больше НЕ срабатывает на экране "welcome" —
  // там есть поле ввода, и именно сочетание открытой клавиатуры с запущенной
  // анимацией вызывало визуальные глюки/растягивание. На экранах "pending" и
  // "blocked" поля ввода нет вообще, клавиатура там никогда не появляется —
  // значит тап в любое место экрана там безопасен для анимации
  if (kind === 'pending' || kind === 'blocked') armGateTrack(); else disarmGateTrack();
}

function submitApplication() {
  var btn = document.getElementById('gateSubmitBtn');
  var inp = document.getElementById('gateNameInput');
  if (!btn || btn.disabled) return;
  var raw = (inp.value || '').trim();
  if (!raw) { toast('Введите фамилию'); sfx.warning(); return; }
  // фамилия принимается только если она есть в графике дежурств (без учёта регистра)
  var name = findRosterName(raw);
  if (!name) { toast('Такой фамилии нет в графике дежурств'); sfx.warning(); return; }
  var u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  var uid = u ? u.id : null;
  if (!uid || !db) { toast('Нет связи с сервером'); sfx.warning(); return; }
  var username = (u && u.username) ? u.username : null;
  btn.disabled = true;
  // фамилия уже закреплена за кем-то одобренным → нельзя подать заявку ещё раз
  // от того же имени, пока админ не уберёт того человека из "Принятых"
  db.collection('approved').where('name', '==', name).limit(1).get().then(function(snap){
    if (!snap.empty) {
      btn.disabled = false;
      toast('Эта фамилия уже занята другим пользователем');
      sfx.warning();
      return;
    }
    return applicationRef(uid).set({uid:uid, name:name, username:username, ts:Date.now()}).then(function(){
      toast('Заявка подана!');
      showGate('pending', uid, name);
    });
  }).catch(function(err){
    console.log('submit application', err);
    btn.disabled = false;
    toast('Не удалось отправить заявку');
  });
}

// ── GATE TRACK (пасхалка: музыка от тапа по экрану входа, запускается один раз
// за сессию; не срабатывает от тапов по полю ввода и кнопке заявки) ───────────
var _gateTrackPlayed = false;
function _gateTrackHandler(e) {
  if (_gateTrackPlayed) return;
  if (e && e.target && e.target.closest && e.target.closest('.no-egg')) return;
  _gateTrackPlayed = true;
  var a = document.getElementById('gateTrack');
  if (a) {
    a.addEventListener('ended', function(){ setEmojiMode(0); });
    try { a.currentTime = 0; a.play().catch(function(){}); } catch(e) {}
  }
  setEmojiMode(1);
  disarmGateTrack();
}
function armGateTrack() {
  if (_gateTrackPlayed) return;
  var gateEl = document.getElementById('gate');
  gateEl.addEventListener('touchstart', _gateTrackHandler, {capture:true, passive:true});
  gateEl.addEventListener('click', _gateTrackHandler, {capture:true});
}

// ── ПАСХАЛКА: тап по фамилии "Губенко" на главном экране ─────────────────────
// запускает трек, снежинки превращаются в 🤫, рядом с фамилией появляется 🤫;
// по окончании трека всё плавно возвращается как было (переживает render(),
// в т.ч. при +/- счётчика и при "Стереть всё")
function onEasterEggTap() {
  if (_easterEggPlaying) return;
  var a = document.getElementById('easterEggTrack');
  if (!a) return;
  _easterEggPlaying = true;
  var badge = document.getElementById('easterEggEmoji');
  if (badge) badge.style.display = 'inline';
  setEmojiMode(1);
  a.onended = function(){
    _easterEggPlaying = false;
    setEmojiMode(0);
    var b = document.getElementById('easterEggEmoji');
    if (b) b.style.display = 'none';
  };
  try { a.currentTime = 0; a.play().catch(function(){ _easterEggPlaying = false; }); } catch(e) { _easterEggPlaying = false; }
}
function disarmGateTrack() {
  var gateEl = document.getElementById('gate');
  gateEl.removeEventListener('touchstart', _gateTrackHandler, {capture:true});
  gateEl.removeEventListener('click', _gateTrackHandler, {capture:true});
}

function checkAccess() {
  var u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  var uid = u ? u.id : null;
  if (!uid)       { showGate('notg'); return; }
  if (!OWNER_ID)  { showGate('setup', uid); return; }
  if (uid === OWNER_ID) { showApp(); return; }
  if (!db)        { showGate('welcome', uid); return; }

  showGate('loading', uid);
  Promise.all([
    blacklistRef(uid).get(),
    approvedRef(uid).get(),
    applicationRef(uid).get()
  ]).then(function(res){
    var blocked = res[0], approved = res[1], applied = res[2];
    if (blocked.exists)  { showGate('blocked', uid); return; }
    if (approved.exists) { showLimitedApp(); return; }
    if (applied.exists)  { showGate('pending', uid, applied.data().name); return; }
    showGate('welcome', uid);
  }).catch(function(err){
    console.log('access check', err);
    showGate('welcome', uid);
  });
}

var _subOpen = false;

function posMenu(e) {
  var menu = document.getElementById('ctxMenu');

  var vw = window.innerWidth, vh = window.innerHeight;
  menu.style.top=menu.style.bottom=menu.style.left=menu.style.right='';menu.style.transformOrigin='';
  var top   = rect.bottom + 6;

  else                { menu.style.top    = top+'px'; }
  if (right < 8) right = 8;
  menu.style.right = right+'px';

function showMenu() {

function closeMenu() {

// ── JOURNAL ───────────────────────────────────────────────────────────────────
// запись: {t:timestamp_ms, n:число_дежурств_после_+}; храним последние LOG_MAX на человека.
// ВАЖНО: запись должна быть объектом, а не массивом [t,n] — Firestore не
// поддерживает вложенные массивы (массив массивов) в одном поле документа,
// .set() падает с "Nested arrays are not supported".
var LOG_MAX = 150;
function logAdd(name, n) {
  var a = S.log[name] || (S.log[name] = []);
  a.push({t:Date.now(), n:n});
  if (a.length > LOG_MAX) a.splice(0, a.length - LOG_MAX);
}
// «−» откатывает последнюю запись, только если она соответствует текущему числу
function logUndo(name, nBefore) {
  var a = S.log[name];
  if (a && a.length && a[a.length-1].n === nBefore) { a.pop(); }
}
function fmtLog(ts) {
  var d = new Date(ts);
  function z(x){ return (x < 10 ? '0' : '') + x; }
  return z(d.getDate()) + '.' + z(d.getMonth()+1) + '.' + d.getFullYear() + ' / ' + z(d.getHours()) + ':' + z(d.getMinutes());
}
function openJournal(e, name) {
  e.stopPropagation();
  sfx.open();
  posMenu(e);
  buildMenu('Журнал - ' + name, []);
  var body = document.getElementById('ctxBody');
  var a = S.log[name] || [];
  if (!a.length) {
    var em = document.createElement('div'); em.className = 'j-empty'; em.textContent = 'Записей нет';
    body.appendChild(em);
  } else {
    var list = document.createElement('div'); list.className = 'j-list';
    for (var i = a.length - 1; i >= 0; i--) { // новые сверху
      var r = document.createElement('div'); r.className = 'j-row' + (i === a.length - 1 ? ' last' : '');
      r.textContent = fmtLog(a[i].t) + ' - ' + a[i].n;
      list.appendChild(r);
    }
    body.appendChild(list);
  }
  showMenu();
}

// ── PAIR MENU ─────────────────────────────────────────────────────────────────
// строка человека: число + «+» «−» «✕». меню не закрывается, жми сколько надо
function pairPersonRow(pairId, name, slot) {
  var row = document.createElement('div'); row.className = 'p-row';
  var nm  = document.createElement('span'); nm.className = 'p-name'; nm.textContent = name;
  var cnt = document.createElement('span'); cnt.className = 'p-cnt';
  function upd(){ cnt.textContent = S.counts[name] || 0; }
  function btn(cls, txt, fn){
    var b = document.createElement('button'); b.className = 'p-btn '+cls; b.textContent = txt;
    b.onclick = function(ev){ ev.stopPropagation(); fn(); };
    return b;
  }
  row.appendChild(nm); row.appendChild(cnt);
  row.appendChild(btn('plus', '+', function(){
    S.counts[name] = (S.counts[name] || 0) + 1; logAdd(name, S.counts[name]); save(); render(); upd(); sfx.plus();
  }));
  row.appendChild(btn('minus', '\u2212', function(){
    if ((S.counts[name] || 0) > 0) { logUndo(name, S.counts[name]); S.counts[name]--; save(); render(); upd(); sfx.minus(); }
  }));
  row.appendChild(btn('x', '\u2715', function(){
    if (addDebtor(name, pairId, slot)) { save(); render(); toast(name+' — в пропустившие'); sfx.remove(); }
    else { toast(name+' уже в пропустивших'); sfx.warning(); }
  }));
  upd();
  return row;
}

function openPairMenu(e, id) {
  e.stopPropagation();
  sfx.open();
  var p = PAIRS.filter(function(x){ return x.id===id; })[0];
  posMenu(e);
  buildMenu('Пара '+id, []);
  document.getElementById('ctxMenu').classList.add('wide');
  var body = document.getElementById('ctxBody');
  body.appendChild(pairPersonRow(id, p.a, 'a'));
  body.appendChild(pairPersonRow(id, p.b, 'b'));
  showMenu();
}

// ── LAST PAIR MENU (тап по «Список дежурных») ────────────────────────────────
// ввод 1..10 -> галочка слева от номера этой пары; новая пара забирает галочку у прошлой
function openLastMenu(e) {
  e.stopPropagation();
  sfx.open();
  var rect = e.currentTarget.getBoundingClientRect();
  var menu = document.getElementById('ctxMenu');
  buildMenu('Последние', []);
  menu.style.top = menu.style.bottom = menu.style.left = menu.style.right = '';
  menu.style.left = Math.max(8, rect.left) + 'px';
  menu.style.top = (rect.bottom + 6) + 'px';
  menu.style.transformOrigin = 'top left';
  var body = document.getElementById('ctxBody');
  var wrap = document.createElement('div'); wrap.className = 'l-wrap';
  var inp = document.createElement('input');
  inp.className = 'l-input'; inp.type = 'number'; inp.inputMode = 'numeric';
  inp.min = 1; inp.max = PAIRS.length; inp.placeholder = '1\u2013' + PAIRS.length;
  inp.value = S.last || '';
  inp.addEventListener('input', function(){
    var raw = inp.value.replace(/\D/g, '').slice(0, 2);
    if (raw !== inp.value) inp.value = raw;
    if (raw === '') return;
    var n = parseInt(raw, 10);
    if (n < 1 || n > PAIRS.length) { toast('Пара от 1 до ' + PAIRS.length); sfx.warning(); return; }
    if (S.last === n) return;
    S.last = n; save(); render(); sfx.tap();
  });
  inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { inp.blur(); closeMenu(); } });
  var del = document.createElement('button');
  del.className = 'l-del'; del.textContent = 'Удалить';
  del.onclick = function(ev){
    ev.stopPropagation();
    if (S.last == null) { toast('Галочки нет'); sfx.warning(); return; }
    S.last = null; inp.value = ''; save(); render(); sfx.remove();
  };
  wrap.appendChild(inp); wrap.appendChild(del);
  body.appendChild(wrap);
  showMenu();
  setTimeout(function(){ try { inp.focus(); } catch(x){} }, 60);
}

// ── РАССМОТРЕНИЕ ЗАЯВОК (постраничное меню: заявки ⇄ чёрный список) ──────────
var _appsPage = 0;          // 0 = заявки на рассмотрении, 1 = чёрный список, 2 = принятые
var _pendingApps = [];      // [{uid, name, ts}]
var _blacklistArr = [];     // [{uid, name, ts}]
var _approvedArr = [];      // [{uid, name, ts}]

// живые подписки — работают, пока открыт график у владельца; список обновляется
// сам, даже если меню заявок сейчас открыто на экране
function startAdminListeners() {
  if (!db) return;
  db.collection('applications').onSnapshot(function(snap){
    _pendingApps = [];
    snap.forEach(function(doc){ _pendingApps.push(doc.data()); });
    if (_currentMenu === 'apps') renderApplicationsPanel();
  }, function(err){ console.log('apps sync', err); });
  db.collection('blacklist').onSnapshot(function(snap){
    _blacklistArr = [];
    snap.forEach(function(doc){ _blacklistArr.push(doc.data()); });
    if (_currentMenu === 'apps') renderApplicationsPanel();
  }, function(err){ console.log('blacklist sync', err); });
  db.collection('approved').onSnapshot(function(snap){
    _approvedArr = [];
    snap.forEach(function(doc){ _approvedArr.push(doc.data()); });
    if (_currentMenu === 'apps') renderApplicationsPanel();
  }, function(err){ console.log('approved sync', err); });
}

function openApplicationsPanel(e) {
  if (e) e.stopPropagation();
  _appsPage = 0;
  renderApplicationsPanel();
}

function renderApplicationsPanel() {
  _currentMenu = 'apps';
  document.getElementById('ctxMenu').classList.add('wide');

  var hdr = document.getElementById('ctxHdr');
  hdr.className = 'ctx-hdr pg';
  hdr.innerHTML = '';
  var title = document.createElement('span');
  title.textContent = (_appsPage === 0) ? 'Рассмотрение заявок' : (_appsPage === 1) ? 'Чёрный список' : 'Принятые';
  var arrows = document.createElement('div');
  arrows.className = 'pg-arrows';
  var prev = document.createElement('button');
  prev.className = 'pg-arrow'; prev.textContent = '<';
  prev.onclick = function(ev){ ev.stopPropagation(); _appsPage = (_appsPage + 2) % 3; sfx.tap(); renderApplicationsPanel(); };
  var next = document.createElement('button');
  next.className = 'pg-arrow'; next.textContent = '>';
  next.onclick = function(ev){ ev.stopPropagation(); _appsPage = (_appsPage + 1) % 3; sfx.tap(); renderApplicationsPanel(); };
  arrows.appendChild(prev); arrows.appendChild(next);
  hdr.appendChild(title); hdr.appendChild(arrows);

  var body = document.getElementById('ctxBody');
  body.innerHTML = '';

  if (_appsPage === 0) {
    if (!_pendingApps.length) {
      body.innerHTML = '<div class="j-empty">Заявок нет</div>';
    } else {
      _pendingApps.forEach(function(a){ body.appendChild(appRow(a)); });
    }
  } else if (_appsPage === 1) {
    if (!_blacklistArr.length) {
      body.innerHTML = '<div class="j-empty">Список пуст</div>';
    } else {
      _blacklistArr.forEach(function(b){ body.appendChild(blacklistRow(b)); });
    }
  } else {
    if (!_approvedArr.length) {
      body.innerHTML = '<div class="j-empty">Никого нет</div>';
    } else {
      _approvedArr.forEach(function(a){ body.appendChild(approvedRow(a)); });
    }
  }
  showMenu();
}

// \u043f\u043e\u043a\u0430\u0437\u0430\u0442\u044c \u044e\u0437\u0435\u0440\u043d\u0435\u0439\u043c \u0442\u0435\u043b\u0435\u0433\u0440\u0430\u043c\u0430 \u0447\u0435\u043b\u043e\u0432\u0435\u043a\u0430 \u0442\u0430\u043f\u043e\u043c \u043f\u043e \u0444\u0430\u043c\u0438\u043b\u0438\u0438 \u2014 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u043d\u0430 \u0432\u0441\u0435\u0445
// \u0442\u0440\u0451\u0445 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0430\u0445 (\u0437\u0430\u044f\u0432\u043a\u0438 / \u0447\u0451\u0440\u043d\u044b\u0439 \u0441\u043f\u0438\u0441\u043e\u043a / \u043f\u0440\u0438\u043d\u044f\u0442\u044b\u0435)
function showUsername(entry) {
  var u = entry.username;
  if (u) toast('@' + u, function(){ openTelegramProfile(u); });
  else   toast('\u042e\u0437\u0435\u0440\u043d\u0435\u0439\u043c \u043e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0443\u0435\u0442');
}
function nameSpan(label, entry) {
  var nm = document.createElement('span'); nm.className = 'p-name'; nm.textContent = label;
  nm.style.cursor = 'pointer'; nm.style.touchAction = 'manipulation';
  nm.onclick = function(ev){ ev.stopPropagation(); showUsername(entry); sfx.tap(); };
  return nm;
}

function appRow(a) {
  var row = document.createElement('div'); row.className = 'p-row';
  row.appendChild(nameSpan(a.name, a));
  var xBtn = document.createElement('button'); xBtn.className = 'p-btn x'; xBtn.textContent = '\u2715';
  xBtn.onclick = function(ev){ ev.stopPropagation(); rejectApplication(a); };
  var okBtn = document.createElement('button'); okBtn.className = 'p-btn plus'; okBtn.textContent = '\u2713';
  okBtn.onclick = function(ev){ ev.stopPropagation(); approveApplication(a); };
  row.appendChild(xBtn); row.appendChild(okBtn);
  return row;
}

function blacklistRow(b) {
  var row = document.createElement('div'); row.className = 'p-row';
  row.appendChild(nameSpan(b.name, b));
  var xBtn = document.createElement('button'); xBtn.className = 'p-btn x'; xBtn.textContent = '\u2715';
  xBtn.onclick = function(ev){ ev.stopPropagation(); unblockUser(b); };
  row.appendChild(xBtn);
  return row;
}

function approvedRow(a) {
  var row = document.createElement('div'); row.className = 'p-row';
  row.appendChild(nameSpan(a.name, a));
  var xBtn = document.createElement('button'); xBtn.className = 'p-btn x'; xBtn.textContent = '\u2715';
  xBtn.onclick = function(ev){ ev.stopPropagation(); removeApproved(a); };
  row.appendChild(xBtn);
  return row;
}

// заявка отклонена → в чёрный список; экран входа у этого человека покажет
// "Вход заблокирован", кнопка заявки станет неактивна
function rejectApplication(a) {
  if (!db) return;
  applicationRef(a.uid).delete().catch(function(err){ console.log('reject/del', err); });
  blacklistRef(a.uid).set({uid:a.uid, name:a.name, username:(a.username||null), ts:Date.now()}).then(function(){
    toast(a.name + ' — заявка отклонена'); sfx.remove();
  }).catch(function(err){ console.log('reject/set', err); });
}

// заявка одобрена → человек получает урезанный доступ к графику
function approveApplication(a) {
  if (!db) return;
  applicationRef(a.uid).delete().catch(function(err){ console.log('approve/del', err); });
  approvedRef(a.uid).set({uid:a.uid, name:a.name, username:(a.username||null), ts:Date.now()}).then(function(){
    toast(a.name + ' — доступ выдан'); sfx.success();
  }).catch(function(err){ console.log('approve/set', err); });
}

// убрать из чёрного списка → человек снова может подать заявку
function unblockUser(b) {
  if (!db) return;
  blacklistRef(b.uid).delete().then(function(){
    toast(b.name + ' — снят из чёрного списка'); sfx.remove();
  }).catch(function(err){ console.log('unblock', err); });
}

// убрать из принятых → доступ пропадает, человеку нужно подавать заявку заново
function removeApproved(a) {
  if (!db) return;
  approvedRef(a.uid).delete().then(function(){
    toast(a.name + ' — доступ отозван'); sfx.remove();
  }).catch(function(err){ console.log('remove approved', err); });
}

// ── DEBTOR MENU ───────────────────────────────────────────────────────────────
function openDebtorMenu(e, idx) {
  e.stopPropagation();
  sfx.open();
  var d = S.debtors[idx];
  posMenu(e);
  buildMenu(d.name, [
    {label:'Продежурил', cls:'green', icon:'✓', fn:function(){ markDebtorDone(idx); closeMenu(); sfx.success(); }},
    {label:'Удалить',    cls:'red',   icon:'✕', fn:function(){ deleteDebtor(idx);   closeMenu(); sfx.remove(); }}
  ]);
  showMenu();
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function markDebtorDone(idx) {
  var d = S.debtors[idx];
  S.counts[d.name] = (S.counts[d.name]||0)+1;
  logAdd(d.name, S.counts[d.name]);
  S.debtors.splice(idx,1);
  save(); render();
  toast(d.name+' — отдежурил ✓');
}

// просто убрать из пропустивших, без +1 к счётчику
function deleteDebtor(idx) {
  var d = S.debtors[idx];
  S.debtors.splice(idx,1);
  save(); render();
  toast(d.name+' — удалён из пропустивших');
}

function addDebtor(name,pairId,slot){
  var exists = S.debtors.filter(function(d){ return d.name===name&&d.pairId===pairId; }).length>0;
  if (!exists) S.debtors.push({name:name,pairId:pairId,slot:slot});
  return !exists;
}

// стереть всё: счётчики в ноль и список пропустивших пустой
function doResetAll(){
  S={ debtors:[], counts:defaultCounts(), log:{} };
  save(); render(); hideRand();
  toast('Всё стёрто');
}

// ── RANDOMIZER ────────────────────────────────────────────────────────────────
var _randBusy = false, _randT = null;

function haptic(kind) {
  try {
    var h = TG && TG.HapticFeedback; if (!h) return;
    if (kind === 'done') h.notificationOccurred('success'); else h.impactOccurred('light');
  } catch(e) {}
}

// прокрутка фамилий пропустивших с замедлением, потом посадка на выбранного пропустившего
function randomize(){
  if (_randBusy) return;
  if (!S.debtors.length){ toast('Пропустивших нет'); sfx.warning(); return; }
  sfx.open();
  var pick = S.debtors[Math.floor(Math.random()*S.debtors.length)];
  var pair = PAIRS.filter(function(p){ return p.id===pick.pairId; })[0];
  var res = document.getElementById('randResult');
  var nameEl = document.getElementById('randName');
  var subEl  = document.getElementById('randSub');
  var btn = document.getElementById('randBtn');
  var names = S.debtors.map(function(d){ return d.name; }); // крутим только пропустивших

  res.classList.remove('done'); res.classList.add('show');
  subEl.classList.remove('in'); subEl.textContent = '';
  nameEl.classList.remove('land');
  _randBusy = true; btn.disabled = true;

  var steps = 18, i = 0, last = '';
  function step(){
    if (i >= steps) { land(); return; }
    var t = i / steps, delay = 50 + Math.pow(t, 2.4) * 230;
    var nm; do { nm = names[Math.floor(Math.random()*names.length)]; } while (nm === last && names.length > 1);
    last = nm; nameEl.textContent = nm;
    nameEl.classList.remove('tick'); void nameEl.offsetWidth;
    nameEl.style.animationDuration = Math.round(delay*0.85)+'ms'; nameEl.classList.add('tick');
    haptic('tick'); sfx.reelTick();
    i++; _randT = setTimeout(step, delay);
  }
  function land(){
    nameEl.classList.remove('tick'); nameEl.style.animationDuration = '';
    void nameEl.offsetWidth;
    nameEl.textContent = pick.name; nameEl.classList.add('land');
    subEl.textContent = 'пара '+pick.pairId+' · '+pair.a+' & '+pair.b; subEl.classList.add('in');
    void res.offsetWidth; res.classList.add('done');
    burst(); haptic('done'); sfx.land();
    _randBusy = false; btn.disabled = false;
  }
  step();
}

function burst(){
  var box = document.getElementById('randBurst'); box.innerHTML = '';
  for (var i=0;i<16;i++){
    var sp = document.createElement('span'); sp.className = 'spark';
    var a = (i/16)*6.2832 + Math.random()*0.4, d = 55 + Math.random()*45;
    sp.style.setProperty('--dx', Math.round(Math.cos(a)*d)+'px');
    sp.style.setProperty('--dy', Math.round(Math.sin(a)*d*0.6)+'px');
    sp.style.background = (i%3===0) ? '#7fd8ef' : '#f1ece1';
    box.appendChild(sp);
  }
  setTimeout(function(){ box.innerHTML = ''; }, 900);
}

function hideRand(){
  clearTimeout(_randT); _randBusy = false;
  var b = document.getElementById('randBtn'); if (b) b.disabled = false;
  document.getElementById('randResult').classList.remove('show','done');
  sfx.close();
}

// ── COPY COUNTS ───────────────────────────────────────────────────────────────
function copyCounts() {
  var lines = [];
  PAIRS.forEach(function(p){
    lines.push(p.a + ' - ' + (S.counts[p.a] || 0));
    lines.push(p.b + ' - ' + (S.counts[p.b] || 0));
  });
  var text = lines.join('\n');
  function ok(){ toast('Счётчики скопированы'); haptic('done'); sfx.copy(); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var r = false; try { r = document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    if (r) ok(); else { toast('Не удалось скопировать'); sfx.warning(); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
var _tt;
// onClick — необязательный обработчик тапа по самому уведомлению (например,
// открыть профиль человека по юзернейму); если не передан, тост просто
// информационный, как и раньше
function toast(msg, onClick){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  t.onclick = onClick ? function(ev){ ev.stopPropagation(); onClick(); t.classList.remove('show'); clearTimeout(_tt); } : null;
  t.classList.toggle('clickable', !!onClick);
  clearTimeout(_tt); _tt=setTimeout(function(){ t.classList.remove('show'); },2400);
}

// открыть профиль/чат пользователя Telegram по юзернейму
function openTelegramProfile(username){
  var url = 'https://t.me/' + username;
  try {
    if (TG && TG.openTelegramLink) { TG.openTelegramLink(url); return; }
  } catch(e) {}
  window.open(url, '_blank');
}
