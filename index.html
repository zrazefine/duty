<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>График Дежурства</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:#000; --surface:#0d0d0d; --surface2:#161616;
    --border:#1e1e1e; --border2:#2a2a2a;
    --text:#fff; --text-muted:#555; --text-dim:#888;
    --green:#4caf50; --red:#ef5350;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
    min-height:100vh;font-size:14px;
    padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
    padding-top:env(safe-area-inset-top,0px);
  }

  /* ACCESS GATE */
  #gate{
    position:fixed;inset:0;z-index:9999;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 0%,#12161f 0%,#06070b 55%,#000 100%);
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  #snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .pass-card{
    position:relative;width:100%;max-width:320px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:30px 22px 26px;text-align:center;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);
    border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .pass-badge{
    width:46px;height:46px;border-radius:50%;
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center;margin-bottom:2px;
  }
  .pass-badge svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .pass-badge.bad{border-color:rgba(239,83,80,.5);background:rgba(239,83,80,.08)}
  .pass-badge.bad svg{stroke:var(--red)}
  #gate h1{font-size:20px;font-weight:600;letter-spacing:.3px}
  #gate p{font-size:13px;color:var(--text-dim);line-height:1.45}
  #gateId{font-family:monospace;font-size:12px;color:var(--text-muted);letter-spacing:1px;margin-top:2px}
  #gateId.big{font-size:20px;color:var(--text);letter-spacing:2px;padding:10px 14px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.05);user-select:all;-webkit-user-select:all}

  /* MAIN */
  #mainApp{display:none}
  header{
    display:flex;align-items:center;padding:16px 14px 12px;
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:50;background:var(--bg);
  }
  .hdr-title{font-size:17px;font-weight:600;flex:1}
  .dots-btn{
    background:none;border:none;color:var(--text-muted);
    font-size:20px;cursor:pointer;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;flex-shrink:0;
  }
  .dots-btn:active{background:var(--surface2)}

  .sec-label{
    font-size:10px;font-weight:600;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--text-muted);
    padding:16px 14px 6px;
  }

  .sec-row{display:flex;align-items:center}
  .sec-row .sec-label{padding-right:0}
  .copy-btn{
    background:none;border:none;color:var(--text-muted);width:30px;height:30px;border-radius:8px;
    margin-top:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;
  }
  .copy-btn:active{background:var(--surface2)}
  .copy-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* DUTY LIST */
  .duty-list{display:flex;flex-direction:column}
  .duty-item{
    display:flex;align-items:center;padding:0 14px;
    border-bottom:1px solid var(--border);min-height:64px;gap:10px;
  }
  .duty-num{font-size:11px;color:var(--text-muted);min-width:18px;text-align:right}
  .duty-names{flex:1;display:flex;flex-direction:column;gap:5px}
  .person-row{display:flex;align-items:center;gap:7px}
  .person-name{font-size:14px;flex:1}
  .person-count{
    font-size:12px;font-weight:600;color:var(--text-muted);min-width:34px;text-align:center;font-family:monospace;
    background:none;border:1px solid var(--border);border-radius:6px;padding:4px 8px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .person-count:active{background:var(--surface2)}
  .person-count.nz{color:var(--text-dim)}

  /* DEBTORS */
  .debtors-list{display:flex;flex-direction:column}
  .debtor-item{
    display:flex;align-items:center;padding:11px 14px;
    border-bottom:1px solid var(--border);gap:10px;
  }
  .debtor-name{flex:1;font-size:14px;color:var(--red)}
  .debtor-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
  .empty-msg{padding:14px 14px;font-size:13px;color:var(--text-muted)}

  /* RAND */
  .rand-wrap{padding:14px}
  .rand-btn{
    width:100%;background:#fff;color:#000;border:none;border-radius:8px;
    padding:13px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .rand-btn:active{opacity:.7}
  .rand-btn:disabled{opacity:.5;cursor:default}
  .rand-result{
    margin-top:10px;position:relative;overflow:hidden;
    background:radial-gradient(120% 140% at 50% 0%,#1b1b1b 0%,var(--surface2) 60%);
    border:1px solid var(--border2);border-radius:14px;padding:16px 14px 14px;
    display:none;flex-direction:column;align-items:center;text-align:center;
  }
  .rand-result.show{display:flex;animation:rrIn .3s ease-out}
  .rand-result.done{border-color:rgba(239,83,80,.5);animation:ringPulse .9s ease-out}
  .rr-label{font-size:10px;color:var(--text-muted);letter-spacing:1.6px;text-transform:uppercase}
  .rr-reel{height:46px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:10px 0 4px}
  .rr-name{font-size:28px;font-weight:700;letter-spacing:.3px;color:var(--text-dim);white-space:nowrap}
  .rr-name.tick{animation:tick 120ms ease-out}
  .rr-name.land{color:var(--red);text-shadow:0 0 18px rgba(239,83,80,.45);animation:land .6s cubic-bezier(.34,1.56,.64,1)}
  .rr-sub{font-size:12px;color:var(--text-muted);min-height:16px;opacity:0;transition:opacity .4s}
  .rr-sub.in{opacity:1}
  .rr-close{
    position:absolute;top:8px;right:8px;
    background:none;border:none;color:var(--text-muted);font-size:15px;
    cursor:pointer;width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .rr-close:active{background:var(--border)}
  .burst{position:absolute;inset:0;pointer-events:none}
  .spark{
    position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;
    animation:spark .8s ease-out forwards;
  }
  @keyframes rrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes tick{from{transform:translateY(-55%);opacity:0;filter:blur(2px)}to{transform:none;opacity:1;filter:none}}
  @keyframes land{0%{transform:scale(.8);opacity:.3}55%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
  @keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(239,83,80,.45)}100%{box-shadow:0 0 0 18px rgba(239,83,80,0)}}
  @keyframes spark{
    from{transform:translate(-50%,-50%) scale(1);opacity:1}
    to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}
  }

  /* OVERLAY */
  .overlay{position:fixed;inset:0;z-index:200;display:none}
  .overlay.active{display:block}
  .ov-bd{position:absolute;inset:0;background:rgba(0,0,0,.65)}
  .ctx-menu{
    position:absolute;background:var(--surface2);
    border:1px solid var(--border2);border-radius:10px;
    min-width:210px;box-shadow:0 8px 40px rgba(0,0,0,.8);
    overflow:hidden;
    transform:scale(.85);opacity:0;transform-origin:top right;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),opacity .12s;
  }
  .ctx-menu.open{transform:scale(1);opacity:1}
  .ctx-hdr{
    padding:10px 13px 8px;font-size:10px;font-weight:600;
    letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);
    border-bottom:1px solid var(--border);
  }
  .ctx-item{
    padding:11px 13px;font-size:14px;cursor:pointer;
    display:flex;align-items:center;gap:10px;color:var(--text);
    border-bottom:1px solid var(--border);transition:background .12s;
  }
  .ctx-item:last-child{border-bottom:none}
  .ctx-item:active{background:var(--border)}
  .ctx-item.green{color:var(--green)}
  .ctx-item.red{color:var(--red)}
  .sub-list{background:var(--surface);display:none;flex-direction:column}
  .sub-list.open{display:flex}
  .sub-item{
    padding:10px 13px 10px 24px;font-size:13px;color:var(--text-dim);
    cursor:pointer;border-bottom:1px solid var(--border);
    transition:background .12s;
  }
  .sub-item:last-child{border-bottom:none}
  .sub-item:active{background:var(--border)}

  /* PAIR MENU ROWS */
  .ctx-menu.wide{min-width:272px}
  .p-row{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 13px;border-bottom:1px solid var(--border)}
  .p-row:last-child{border-bottom:none}
  .p-name{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-cnt{font-size:12px;font-family:monospace;color:var(--text-dim);min-width:22px;text-align:center}
  .p-btn{
    width:34px;height:34px;border-radius:8px;border:1px solid var(--border2);background:none;
    color:var(--text);font-size:18px;line-height:1;cursor:pointer;touch-action:manipulation;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .p-btn:active{background:var(--border)}
  .p-btn.plus{color:var(--green)}
  .p-btn.x{color:var(--red)}

  /* TOAST */
  /* EDIT MODAL */
  .modal-bg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);display:none;align-items:flex-start;justify-content:center;padding-top:18vh}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:16px;width:min(280px,86vw)}
  .modal-title{font-size:13px;color:var(--text-dim);margin-bottom:10px}
  .modal input{
    width:100%;font-size:16px;padding:10px 12px;background:var(--bg);border:1px solid var(--border2);
    border-radius:8px;outline:none;color:var(--text);font-family:monospace;text-align:center;
  }
  .modal-btns{display:flex;gap:8px;margin-top:12px}
  .modal-btns button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border2);background:none;color:var(--text-dim);font-size:14px;cursor:pointer}
  .modal-btns button.ok{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}

  .toast{
    position:fixed;
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    left:50%;transform:translateX(-50%) translateY(80px);
    opacity:0;visibility:hidden;
    background:var(--surface2);border:1px solid var(--border2);
    border-radius:20px;padding:9px 18px;font-size:13px;color:var(--text);
    white-space:nowrap;z-index:999;pointer-events:none;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s,visibility 0s linear .25s;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s,visibility 0s}
</style>
</head>
<body>

<!-- ACCESS GATE -->
<div id="gate">
  <canvas id="snow"></canvas>
  <div class="pass-card">
    <div class="pass-badge" id="gateBadge">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1 id="gateTitle"></h1>
    <p id="gateText"></p>
    <div id="gateId"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp">
  <header>
    <span class="hdr-title">График Дежурства</span>
    <button class="dots-btn" onclick="openHeaderMenu(event)">⋯</button>
  </header>

  <div class="sec-row">
    <div class="sec-label">Список дежурных</div>
    <button class="copy-btn" onclick="copyCounts()" aria-label="Скопировать счётчики">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
    </button>
  </div>
  <div class="duty-list" id="dutyList"></div>

  <div class="sec-label">Должники</div>
  <div class="debtors-list" id="debtorsList"></div>

  <div class="rand-wrap">
    <button class="rand-btn" id="randBtn" onclick="randomize()">🎲 Рандомайзер</button>
    <div class="rand-result" id="randResult">
      <button class="rr-close" onclick="hideRand()">✕</button>
      <div class="rr-label">Случайный должник</div>
      <div class="rr-reel"><div class="rr-name" id="randName">—</div></div>
      <div class="rr-sub" id="randSub"></div>
      <div class="burst" id="randBurst"></div>
    </div>
  </div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="ov-bd" onclick="closeMenu()"></div>
  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-hdr" id="ctxHdr">ДЕЙСТВИЯ</div>
    <div id="ctxBody"></div>
  </div>
</div>

<div class="modal-bg" id="editBg" onclick="if(event.target===this)closeEdit()">
  <div class="modal">
    <div class="modal-title" id="editTitle"></div>
    <input id="editInput" type="number" inputmode="numeric" min="0" max="9999">
    <div class="modal-btns">
      <button onclick="closeEdit()">Отмена</button>
      <button class="ok" onclick="applyEdit()">Сохранить</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── PAIRS ─────────────────────────────────────────────────────────────────────
var PAIRS = [
  {id:1,  a:'Апин',      b:'Кондрова'},
  {id:2,  a:'Абрамова',  b:'Зайчикова'},
  {id:3,  a:'Воронкова', b:'Козырева'},
  {id:4,  a:'Губенко',   b:'Воробьев'},
  {id:5,  a:'Игнатова',  b:'Ларионова'},
  {id:6,  a:'Ищенко',    b:'Шадрин'},
  {id:7,  a:'Овчаренко', b:'Карпенко'},
  {id:8,  a:'Титов',     b:'Шушарина'},
  {id:9,  a:'Макарчева', b:'Федоров'},
  {id:10, a:'Щербаков',  b:'Кудреевич'}
];

// FILL: твой Telegram user id (число). при первом запуске экран покажет его, пока 0 никого не пускает
var OWNER_ID = 8018085618;

// ── STATE ─────────────────────────────────────────────────────────────────────
var S; // declared first, assigned below

function defaultCounts() {
  var c = {};
  PAIRS.forEach(function(p){ c[p.a]=0; c[p.b]=0; });
  return c;
}

function normalize(o) {
  if (!o || typeof o !== 'object') o = {};
  if (!o.counts || typeof o.counts !== 'object') o.counts = {};
  if (!Array.isArray(o.debtors)) o.debtors = [];
  PAIRS.forEach(function(p){
    if (o.counts[p.a] === undefined) o.counts[p.a] = 0;
    if (o.counts[p.b] === undefined) o.counts[p.b] = 0;
  });
  return o;
}

function loadState() {
  try {
    var raw = localStorage.getItem('duty_v5');
    if (raw) return normalize(JSON.parse(raw));
  } catch(e) {}
  return normalize({});
}

// ── CLOUD (Telegram CloudStorage: твой тг-аккаунт, общий для всех устройств) ──
var TG = window.Telegram && window.Telegram.WebApp;
var CS = (TG && TG.initData && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9') && TG.CloudStorage) ? TG.CloudStorage : null;

function persistLocal() {
  try { localStorage.setItem('duty_v5', JSON.stringify(S)); } catch(e) {}
}

var _ct;
function cloudPush() {
  if (!CS) return;
  clearTimeout(_ct);
  _ct = setTimeout(function(){
    var json = JSON.stringify(S);
    if (json.length > 4096) { toast('Облако: данные не влезли (>4096)'); return; } // лимит тг на значение
    CS.setItem('duty_v5', json, function(err){ if (err) console.log('cloud set', err); });
  }, 400);
}

// у кого ts новее, тот и прав; без ts (старые данные) облако выигрывает, если оно есть
function cloudPull() {
  if (!CS) return;
  CS.getItem('duty_v5', function(err, val){
    if (err) return;
    var c = null;
    try { if (val) c = normalize(JSON.parse(val)); } catch(e) {}
    var lt = S.ts || 0;
    if (c && (c.ts || 0) > lt) {
      S = c; persistLocal(); render();
      toast('Данные подтянуты из облака');
    } else if (!c || (c.ts || 0) < lt) {
      cloudPush();
    }
  });
}

function save() {
  S.ts = Date.now();
  persistLocal();
  cloudPush();
}

// initialise S immediately
S = loadState();

// ── SNOW (экран блокировки, редкий, белые точки) ─────────────────────────────
var _snowOn = false;
var startSnow = function(){};
(function(){
  var cv = document.getElementById('snow'); if (!cv) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0, flakes = [];
  function size(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function mk(initial){
    return { x:Math.random()*W, y:initial?Math.random()*H:-6, r:0.8+Math.random()*1.5,
             v:0.25+Math.random()*0.55, a:0.35+Math.random()*0.55, ph:Math.random()*6.28, sw:0.2+Math.random()*0.5 };
  }
  function tick(t){
    if (!_snowOn) return;
    ctx.clearRect(0,0,W,H); ctx.fillStyle = '#fff';
    for (var i=0;i<flakes.length;i++){
      var f = flakes[i];
      f.y += f.v; f.x += Math.sin(t/1500 + f.ph) * f.sw * 0.6;
      if (f.y > H+6) { flakes[i] = f = mk(false); }
      ctx.globalAlpha = f.a; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  startSnow = function(){
    if (_snowOn) return;
    size(); flakes = [];
    var N = Math.round(Math.min(45, Math.max(24, W*H/9000)));
    for (var i=0;i<N;i++) flakes.push(mk(true));
    window.addEventListener('resize', size);
    _snowOn = true; requestAnimationFrame(tick);
  };
})();

// ── ACCESS (вход через телеграм: пускает только OWNER_ID) ─────────────────────
// ВАЖНО: это проверка на экране, не серверная защита. данные лежат в твоём CloudStorage
// и на устройстве, чужой их всё равно не получит. серверная проверка initData нужна только с бэкендом.
var _owner = false;

function showGate(kind, uid) {
  var T = {
    notg:    ['Открой через Telegram', 'Этот график работает только внутри бота.', false],
    setup:   ['Первый запуск', 'Твой Telegram ID. Пришли его, впишу в файл, и вход заработает.', false],
    blocked: ['Доступ заблокирован', 'Этот график доступен только владельцу.', true]
  }[kind];
  document.getElementById('gateTitle').textContent = T[0];
  document.getElementById('gateText').textContent  = T[1];
  document.getElementById('gateBadge').classList.toggle('bad', T[2]);
  var idEl = document.getElementById('gateId');
  idEl.textContent = uid ? (kind === 'setup' ? String(uid) : 'ID: ' + uid) : '';
  idEl.classList.toggle('big', kind === 'setup');
  document.getElementById('gate').style.display = 'flex';
  startSnow();
}

function showApp() {
  _owner = true; _snowOn = false;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  render();
  cloudPull();
}

function checkAccess() {
  var u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  var uid = u ? u.id : null;
  if (!uid)       { showGate('notg'); return; }
  if (!OWNER_ID)  { showGate('setup', uid); return; }
  if (uid === OWNER_ID) { showApp(); return; }
  showGate('blocked', uid);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  renderDuty();
  renderDebtors();
}

function renderDuty() {
  var el = document.getElementById('dutyList');
  el.innerHTML = '';
  PAIRS.forEach(function(p) {
    var div = document.createElement('div');
    div.className = 'duty-item';
    div.innerHTML =
      '<span class="duty-num">'+p.id+'</span>' +
      '<div class="duty-names">' +
        pRow(p.a, S.counts[p.a] || 0) +
        pRow(p.b, S.counts[p.b] || 0) +
      '</div>' +
      '<button class="dots-btn" onclick="openPairMenu(event,'+p.id+')">⋯</button>';
    el.appendChild(div);
  });
}

function pRow(name, count) {
  return '<div class="person-row">' +
    '<span class="person-name">'+name+'</span>' +
    '<button class="person-count '+(count>0?'nz':'')+'" onclick="openEdit(\''+name+'\')">'+count+'</button>' +
    '</div>';
}

function renderDebtors() {
  var el = document.getElementById('debtorsList');
  el.innerHTML = '';
  if (!S.debtors.length) {
    el.innerHTML = '<div class="empty-msg">Должников нет</div>';
    return;
  }
  S.debtors.forEach(function(d, i) {
    var pair = PAIRS.filter(function(p){ return p.id===d.pairId; })[0];
    var div = document.createElement('div');
    div.className = 'debtor-item';
    div.innerHTML =
      '<div style="flex:1">' +
        '<div class="debtor-name">'+d.name+'</div>' +
        '<div class="debtor-sub">пара '+d.pairId+' · '+pair.a+' &amp; '+pair.b+'</div>' +
      '</div>' +
      '<button class="dots-btn" onclick="openDebtorMenu(event,'+i+')">⋯</button>';
    el.appendChild(div);
  });
}

// ── CONTEXT MENU ──────────────────────────────────────────────────────────────
var _subOpen = false;

function posMenu(e) {
  var menu = document.getElementById('ctxMenu');
  var btn  = e.currentTarget;
  var rect = btn.getBoundingClientRect();
  var vw = window.innerWidth, vh = window.innerHeight;
  menu.style.top=menu.style.bottom=menu.style.left=menu.style.right='';
  var top   = rect.bottom + 6;
  var right = vw - rect.right + 4;
  if (top + 300 > vh) { menu.style.bottom = (vh - rect.top + 6)+'px'; }
  else                { menu.style.top    = top+'px'; }
  if (right < 8) right = 8;
  menu.style.right = right+'px';
}

function showMenu() {
  document.getElementById('overlay').classList.add('active');
  requestAnimationFrame(function(){
    document.getElementById('ctxMenu').classList.add('open');
  });
}

function closeMenu() {
  document.getElementById('ctxMenu').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
  _subOpen = false;
}

function buildMenu(headerText, items) {
  document.getElementById('ctxMenu').classList.remove('wide');
  document.getElementById('ctxHdr').textContent = headerText;
  var body = document.getElementById('ctxBody');
  body.innerHTML = '';
  _subOpen = false;

  items.forEach(function(item) {
    if (item.type === 'sub') {
      var trigger = document.createElement('div');
      trigger.className = 'ctx-item green';
      trigger.innerHTML = '<span>✓</span> '+item.label;
      var subEl = document.createElement('div');
      subEl.className = 'sub-list';
      trigger.onclick = function() {
        _subOpen = !_subOpen;
        subEl.classList.toggle('open', _subOpen);
      };
      item.children.forEach(function(c) {
        var si = document.createElement('div');
        si.className = 'sub-item';
        si.textContent = c.label;
        si.onclick = c.fn;
        subEl.appendChild(si);
      });
      body.appendChild(trigger);
      body.appendChild(subEl);
    } else {
      var div = document.createElement('div');
      div.className = 'ctx-item '+(item.cls||'');
      div.innerHTML = '<span>'+(item.icon||'')+'</span> '+item.label;
      div.onclick = item.fn;
      body.appendChild(div);
    }
  });
}

// ── PAIR MENU ─────────────────────────────────────────────────────────────────
// строка человека: число + «+» «−» «✕». меню не закрывается, жми сколько надо
function pairPersonRow(pairId, name, slot) {
  var row = document.createElement('div'); row.className = 'p-row';
  var nm  = document.createElement('span'); nm.className = 'p-name'; nm.textContent = name;
  var cnt = document.createElement('span'); cnt.className = 'p-cnt';
  function upd(){ cnt.textContent = S.counts[name] || 0; }
  function btn(cls, txt, fn){
    var b = document.createElement('button'); b.className = 'p-btn '+cls; b.textContent = txt;
    b.onclick = function(ev){ ev.stopPropagation(); fn(); };
    return b;
  }
  row.appendChild(nm); row.appendChild(cnt);
  row.appendChild(btn('plus', '+', function(){
    S.counts[name] = (S.counts[name] || 0) + 1; save(); render(); upd();
  }));
  row.appendChild(btn('minus', '\u2212', function(){
    if ((S.counts[name] || 0) > 0) { S.counts[name]--; save(); render(); upd(); }
  }));
  row.appendChild(btn('x', '\u2715', function(){
    if (addDebtor(name, pairId, slot)) { save(); render(); toast(name+' — в должники'); }
    else toast(name+' уже в должниках');
  }));
  upd();
  return row;
}

function openPairMenu(e, id) {
  e.stopPropagation();
  var p = PAIRS.filter(function(x){ return x.id===id; })[0];
  posMenu(e);
  buildMenu('Пара '+id, []);
  document.getElementById('ctxMenu').classList.add('wide');
  var body = document.getElementById('ctxBody');
  body.appendChild(pairPersonRow(id, p.a, 'a'));
  body.appendChild(pairPersonRow(id, p.b, 'b'));
  showMenu();
}

// ── HEADER MENU ───────────────────────────────────────────────────────────────
function openHeaderMenu(e) {
  e.stopPropagation();
  posMenu(e);
  buildMenu('Управление', []);
  var it = document.createElement('div');
  it.className = 'ctx-item red';
  var idle = '<span>✕</span> Стереть всё';
  it.innerHTML = idle;
  var armed = false, timer;
  // защита от случайного нажатия: второй тап в течение 3 с
  it.onclick = function(){
    if (!armed) {
      armed = true; it.innerHTML = '<span>!</span> Точно стереть?';
      timer = setTimeout(function(){ armed = false; it.innerHTML = idle; }, 3000);
      return;
    }
    clearTimeout(timer); doResetAll(); closeMenu();
  };
  document.getElementById('ctxBody').appendChild(it);
  showMenu();
}

// ── DEBTOR MENU ───────────────────────────────────────────────────────────────
function openDebtorMenu(e, idx) {
  e.stopPropagation();
  var d = S.debtors[idx];
  posMenu(e);
  buildMenu(d.name, [
    {label:'Продежурил', cls:'green', icon:'✓', fn:function(){ markDebtorDone(idx); closeMenu(); }},
    {label:'Удалить',    cls:'red',   icon:'✕', fn:function(){ deleteDebtor(idx);   closeMenu(); }}
  ]);
  showMenu();
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function markDebtorDone(idx) {
  var d = S.debtors[idx];
  S.counts[d.name] = (S.counts[d.name]||0)+1;
  S.debtors.splice(idx,1);
  save(); render();
  toast(d.name+' — отдежурил ✓');
}

// просто убрать из должников, без +1 к счётчику
function deleteDebtor(idx) {
  var d = S.debtors[idx];
  S.debtors.splice(idx,1);
  save(); render();
  toast(d.name+' — удалён из должников');
}

function addDebtor(name,pairId,slot){
  var exists = S.debtors.filter(function(d){ return d.name===name&&d.pairId===pairId; }).length>0;
  if (!exists) S.debtors.push({name:name,pairId:pairId,slot:slot});
  return !exists;
}

// стереть всё: счётчики в ноль и список должников пустой
function doResetAll(){
  S={ debtors:[], counts:defaultCounts() };
  save(); render(); hideRand();
  toast('Всё стёрто');
}

// ── RANDOMIZER ────────────────────────────────────────────────────────────────
var _randBusy = false, _randT = null;

function haptic(kind) {
  try {
    var h = TG && TG.HapticFeedback; if (!h) return;
    if (kind === 'done') h.notificationOccurred('success'); else h.impactOccurred('light');
  } catch(e) {}
}

// прокрутка фамилий должников с замедлением, потом посадка на выбранного должника
function randomize(){
  if (_randBusy) return;
  if (!S.debtors.length){ toast('Должников нет'); return; }
  var pick = S.debtors[Math.floor(Math.random()*S.debtors.length)];
  var pair = PAIRS.filter(function(p){ return p.id===pick.pairId; })[0];
  var res = document.getElementById('randResult');
  var nameEl = document.getElementById('randName');
  var subEl  = document.getElementById('randSub');
  var btn = document.getElementById('randBtn');
  var names = S.debtors.map(function(d){ return d.name; }); // крутим только должников

  res.classList.remove('done'); res.classList.add('show');
  subEl.classList.remove('in'); subEl.textContent = '';
  nameEl.classList.remove('land');
  _randBusy = true; btn.disabled = true;

  var steps = 18, i = 0, last = '';
  function step(){
    if (i >= steps) { land(); return; }
    var t = i / steps, delay = 50 + Math.pow(t, 2.4) * 230;
    var nm; do { nm = names[Math.floor(Math.random()*names.length)]; } while (nm === last && names.length > 1);
    last = nm; nameEl.textContent = nm;
    nameEl.classList.remove('tick'); void nameEl.offsetWidth;
    nameEl.style.animationDuration = Math.round(delay*0.85)+'ms'; nameEl.classList.add('tick');
    haptic('tick');
    i++; _randT = setTimeout(step, delay);
  }
  function land(){
    nameEl.classList.remove('tick'); nameEl.style.animationDuration = '';
    void nameEl.offsetWidth;
    nameEl.textContent = pick.name; nameEl.classList.add('land');
    subEl.textContent = 'пара '+pick.pairId+' · '+pair.a+' & '+pair.b; subEl.classList.add('in');
    void res.offsetWidth; res.classList.add('done');
    burst(); haptic('done');
    _randBusy = false; btn.disabled = false;
  }
  step();
}

function burst(){
  var box = document.getElementById('randBurst'); box.innerHTML = '';
  for (var i=0;i<16;i++){
    var sp = document.createElement('span'); sp.className = 'spark';
    var a = (i/16)*6.2832 + Math.random()*0.4, d = 55 + Math.random()*45;
    sp.style.setProperty('--dx', Math.round(Math.cos(a)*d)+'px');
    sp.style.setProperty('--dy', Math.round(Math.sin(a)*d*0.6)+'px');
    sp.style.background = (i%3===0) ? '#ef5350' : '#fff';
    box.appendChild(sp);
  }
  setTimeout(function(){ box.innerHTML = ''; }, 900);
}

function hideRand(){
  clearTimeout(_randT); _randBusy = false;
  var b = document.getElementById('randBtn'); if (b) b.disabled = false;
  document.getElementById('randResult').classList.remove('show','done');
}

// ── EDIT COUNT ────────────────────────────────────────────────────────────────
var _editName = null;
function openEdit(name) {
  _editName = name;
  document.getElementById('editTitle').textContent = name + ' — число дежурств';
  var inp = document.getElementById('editInput');
  inp.value = S.counts[name] || 0;
  document.getElementById('editBg').classList.add('show');
  setTimeout(function(){ inp.focus(); inp.select(); }, 50);
}
function closeEdit() {
  document.getElementById('editBg').classList.remove('show');
  _editName = null;
}
function applyEdit() {
  var v = parseInt(document.getElementById('editInput').value, 10);
  if (isNaN(v) || v < 0 || v > 9999) { toast('Введи число от 0 до 9999'); return; }
  var name = _editName;
  S.counts[name] = v;
  save(); render(); closeEdit();
  toast(name + ': ' + v);
}
document.getElementById('editInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') applyEdit();
});

// ── COPY COUNTS ───────────────────────────────────────────────────────────────
function copyCounts() {
  var lines = [];
  PAIRS.forEach(function(p){
    lines.push(p.a + ' - ' + (S.counts[p.a] || 0));
    lines.push(p.b + ' - ' + (S.counts[p.b] || 0));
  });
  var text = lines.join('\n');
  function ok(){ toast('Счётчики скопированы'); haptic('done'); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var r = false; try { r = document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    if (r) ok(); else toast('Не удалось скопировать');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
var _tt;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(function(){ t.classList.remove('show'); },2400);
}

// ── TG SDK ────────────────────────────────────────────────────────────────────
if (TG) {
  TG.ready();
  TG.expand();
}
checkAccess();
document.addEventListener('visibilitychange', function(){ if (!document.hidden && _owner) cloudPull(); });
</script>
