<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>График Дежурства</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:#000;
    --surface:rgba(255,255,255,.055); --surface2:rgba(255,255,255,.11);
    --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.17);
    --glass:rgba(255,255,255,.06); --glass-bd:rgba(255,255,255,.16);
    --glass-blur:blur(26px) saturate(180%);
    --pop:rgba(26,27,32,.58); --pop-blur:blur(30px) saturate(190%);
    --text:#fff; --text-muted:#75757b; --text-dim:#a9a9ae;
    --green:#30d158; --red:#ff453a; --blue:#0a84ff; --purple:#bf5af2;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
    min-height:100vh;font-size:14px;
    padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
    padding-top:env(safe-area-inset-top,0px);
  }

  /* BACKGROUND (строго чёрно-белое) + SNOW */
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 0%, #1c1c1e 0%, #0a0a0b 55%, #000 100%);
  }
  #snow{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

  /* базовый вид "стекла": прозрачная подложка + размытие/насыщенность того, что за ней,
     плюс мягкий блик по верхней кромке — имитация Liquid Glass */
  .glass,
  .pass-card,.duty-list,.debtors-list,.rand-result,header,.ctx-menu,.modal,.toast{
    position:relative;
    background:var(--glass);
    border:1px solid var(--glass-bd);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  }
  .pass-card::before,.duty-list::before,.debtors-list::before,.rand-result::before,
  .ctx-menu::before,.modal::before{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 30%,
                rgba(255,255,255,0) 68%, rgba(255,255,255,.05) 100%);
    mix-blend-mode:overlay;
  }

  /* ACCESS GATE */
  #gate{
    position:fixed;inset:0;z-index:9999;overflow:hidden;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .pass-card{
    width:100%;max-width:320px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:30px 22px 26px;text-align:center;
    border-radius:28px;
    box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .pass-badge{
    width:48px;height:48px;border-radius:50%;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;margin-bottom:2px;
  }
  .pass-badge svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .pass-badge.bad{border-color:rgba(255,69,58,.55);background:rgba(255,69,58,.12)}
  .pass-badge.bad svg{stroke:var(--red)}
  #gate h1{font-size:20px;font-weight:600;letter-spacing:.3px}
  #gate p{font-size:13px;color:var(--text-dim);line-height:1.45}
  #gateId{font-family:monospace;font-size:12px;color:var(--text-muted);letter-spacing:1px;margin-top:2px}
  #gateId.big{
    font-size:20px;color:var(--text);letter-spacing:2px;padding:10px 14px;
    border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.07);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    user-select:all;-webkit-user-select:all;
  }

  /* MAIN */
  #mainApp{display:none;position:relative;z-index:2}
  header{
    display:flex;align-items:center;padding:16px 14px 12px;
    border-left:none;border-right:none;border-top:none;
    position:sticky;top:0;z-index:50;
    background:rgba(8,9,13,.58);
  }
  .hdr-title{font-size:17px;font-weight:600;flex:1}
  .dots-btn{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--text-dim);
    -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
    font-size:20px;cursor:pointer;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;flex-shrink:0;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s;
  }
  .dots-btn:active{transform:scale(.88);background:rgba(255,255,255,.16)}
  #soundBtn{background:none;border:none;opacity:0}
  #soundBtn:active{background:none}

  .sec-label{
    font-size:10px;font-weight:600;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--text-muted);
    padding:16px 20px 8px;
  }

  .sec-row{display:flex;align-items:center}
  .sec-row .sec-label{padding-right:0}
  .copy-btn{
    background:none;border:none;color:var(--text-muted);
    width:30px;height:30px;
    margin-top:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1),color .15s;
  }
  .copy-btn:active{transform:scale(.85);color:var(--text)}
  .copy-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* DUTY LIST */
  .duty-list,.debtors-list{
    display:flex;flex-direction:column;margin:0 14px;overflow:hidden;
    border-radius:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .duty-item:last-child,.debtor-item:last-child{border-bottom:none}
  .duty-item{
    display:flex;align-items:center;padding:0 14px;
    border-bottom:1px solid var(--border);min-height:64px;gap:10px;
  }
  .duty-num{font-size:11px;color:var(--text-muted);min-width:18px;text-align:right}
  .duty-names{flex:1;display:flex;flex-direction:column;gap:5px}
  .person-row{display:flex;align-items:center;gap:7px}
  .person-name{font-size:14px;flex:1}
  .person-count{
    font-size:12px;font-weight:600;color:var(--text-muted);min-width:34px;text-align:center;font-family:monospace;
    background:rgba(255,255,255,.05);border:1px solid var(--border2);border-radius:10px;padding:4px 8px;cursor:pointer;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s cubic-bezier(.34,1.56,.64,1),background .12s;
  }
  .person-count:active{transform:scale(.9);background:rgba(255,255,255,.15)}
  .person-count.nz{color:var(--text-dim)}

  /* DEBTORS */
  .debtor-item{
    display:flex;align-items:center;padding:11px 14px;
    border-bottom:1px solid var(--border);gap:10px;
  }
  .debtor-name{flex:1;font-size:14px;color:var(--red)}
  .debtor-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
  .empty-msg{padding:14px 14px;font-size:13px;color:var(--text-muted)}

  /* RAND — белое стекло (акцентная кнопка) */
  .rand-wrap{padding:14px}
  .rand-btn{
    width:100%;color:#fff;cursor:pointer;
    border:1px solid rgba(255,255,255,.4);
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.14));
    -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
    box-shadow:0 10px 32px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.5);
    padding:13px;font-size:14px;font-weight:600;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s;
  }
  .rand-btn:active{transform:scale(.97);box-shadow:0 4px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4)}
  .rand-btn:disabled{opacity:.5;cursor:default;transform:none}
  .rand-result{
    margin-top:10px;overflow:hidden;
    border-radius:24px;padding:18px 14px 16px;
    box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1);
    display:none;flex-direction:column;align-items:center;text-align:center;
  }
  .rand-result.show{display:flex;animation:rrIn .3s ease-out}
  .rand-result.done{border-color:rgba(255,69,58,.5);animation:ringPulse .9s ease-out}
  .rr-label{font-size:10px;color:var(--text-muted);letter-spacing:1.6px;text-transform:uppercase}
  .rr-reel{height:46px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:10px 0 4px}
  .rr-name{font-size:28px;font-weight:700;letter-spacing:.3px;color:var(--text-dim);white-space:nowrap}
  .rr-name.tick{animation:tick 120ms ease-out}
  .rr-name.land{color:var(--red);text-shadow:0 0 18px rgba(255,69,58,.45);animation:land .6s cubic-bezier(.34,1.56,.64,1)}
  .rr-sub{font-size:12px;color:var(--text-muted);min-height:16px;opacity:0;transition:opacity .4s}
  .rr-sub.in{opacity:1}
  .rr-close{
    position:absolute;top:8px;right:8px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--text-muted);font-size:15px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    cursor:pointer;width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s;
  }
  .rr-close:active{transform:scale(.88);background:rgba(255,255,255,.18)}
  .burst{position:absolute;inset:0;pointer-events:none}
  .spark{
    position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;
    animation:spark .8s ease-out forwards;
  }
  @keyframes rrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes tick{from{transform:translateY(-55%);opacity:0;filter:blur(2px)}to{transform:none;opacity:1;filter:none}}
  @keyframes land{0%{transform:scale(.8);opacity:.3}55%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
  @keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(255,69,58,.45)}100%{box-shadow:0 0 0 18px rgba(255,69,58,0)}}
  @keyframes spark{
    from{transform:translate(-50%,-50%) scale(1);opacity:1}
    to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}
  }

  /* OVERLAY */
  .overlay{position:fixed;inset:0;z-index:200;display:none}
  .overlay.active{display:block}
  .ov-bd{position:absolute;inset:0;background:rgba(3,4,8,.5)}
  .ctx-menu{
    position:absolute;background:var(--pop);
    -webkit-backdrop-filter:var(--pop-blur);backdrop-filter:var(--pop-blur);
    border:1px solid var(--border2);border-radius:18px;
    min-width:210px;box-shadow:0 10px 44px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);
    overflow:hidden;
    transform:scale(.85);opacity:0;transform-origin:top right;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),opacity .12s;
  }
  .ctx-menu.open{transform:scale(1);opacity:1}
  .ctx-hdr{
    padding:10px 13px 8px;font-size:10px;font-weight:600;
    letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);
    border-bottom:1px solid var(--border);
  }
  .ctx-item{
    padding:11px 13px;font-size:14px;cursor:pointer;
    display:flex;align-items:center;gap:10px;color:var(--text);
    border-bottom:1px solid var(--border);transition:background .12s;
  }
  .ctx-item:last-child{border-bottom:none}
  .ctx-item:active{background:rgba(255,255,255,.1)}
  .ctx-item.green{color:var(--green)}
  .ctx-item.red{color:var(--red)}
  .sub-list{background:rgba(255,255,255,.04);display:none;flex-direction:column}
  .sub-list.open{display:flex}
  .sub-item{
    padding:10px 13px 10px 24px;font-size:13px;color:var(--text-dim);
    cursor:pointer;border-bottom:1px solid var(--border);
    transition:background .12s;
  }
  .sub-item:last-child{border-bottom:none}
  .sub-item:active{background:rgba(255,255,255,.1)}

  /* PAIR MENU ROWS */
  .ctx-menu.wide{min-width:272px}
  .p-row{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 13px;border-bottom:1px solid var(--border)}
  .p-row:last-child{border-bottom:none}
  .p-name{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-cnt{font-size:12px;font-family:monospace;color:var(--text-dim);min-width:22px;text-align:center}
  .p-btn{
    width:34px;height:34px;border-radius:11px;border:1px solid var(--border2);background:rgba(255,255,255,.05);
    color:var(--text);font-size:18px;line-height:1;cursor:pointer;touch-action:manipulation;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .12s cubic-bezier(.34,1.56,.64,1),background .12s;
  }
  .p-btn:active{transform:scale(.88);background:rgba(255,255,255,.16)}
  .p-btn.plus{color:var(--green)}
  .p-btn.x{color:var(--red)}

  /* TOAST */
  /* EDIT MODAL */
  .modal-bg{position:fixed;inset:0;z-index:300;background:rgba(3,4,8,.55);display:none;align-items:flex-start;justify-content:center;padding-top:18vh}
  .modal-bg.show{display:flex}
  .modal{
    background:var(--pop);-webkit-backdrop-filter:var(--pop-blur);backdrop-filter:var(--pop-blur);
    border:1px solid var(--border2);border-radius:22px;padding:16px;width:min(280px,86vw);
    box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .modal-title{font-size:13px;color:var(--text-dim);margin-bottom:10px}
  .modal input{
    width:100%;font-size:16px;padding:10px 12px;background:rgba(0,0,0,.35);border:1px solid var(--border2);
    border-radius:12px;outline:none;color:var(--text);font-family:monospace;text-align:center;
  }
  .modal-btns{display:flex;gap:8px;margin-top:12px}
  .modal-btns button{
    flex:1;padding:10px;border-radius:14px;border:1px solid var(--border2);
    background:rgba(255,255,255,.05);color:var(--text-dim);font-size:14px;cursor:pointer;
    transition:transform .12s cubic-bezier(.34,1.56,.64,1),background .12s;
  }
  .modal-btns button:active{transform:scale(.96)}
  .modal-btns button.ok{background:var(--text);color:#000;border-color:var(--text);font-weight:600}

  .toast{
    position:fixed;
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    left:50%;transform:translateX(-50%) translateY(80px);
    opacity:0;visibility:hidden;
    background:var(--pop);-webkit-backdrop-filter:var(--pop-blur);backdrop-filter:var(--pop-blur);
    border:1px solid var(--border2);
    border-radius:999px;padding:9px 18px;font-size:13px;color:var(--text);
    box-shadow:0 10px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
    white-space:nowrap;z-index:999;pointer-events:none;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s,visibility 0s linear .25s;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s,visibility 0s}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<!-- ACCESS GATE -->
<div id="gate">
  <div class="pass-card">
    <div class="pass-badge" id="gateBadge">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1 id="gateTitle"></h1>
    <p id="gateText"></p>
    <div id="gateId"></div>
  </div>
  <audio id="gateTrack" src="track.mp3" preload="auto" playsinline></audio>
</div>

<!-- MAIN APP -->
<div id="mainApp">
  <header>
    <span class="hdr-title">График Дежурства</span>
    <button class="dots-btn" id="soundBtn" onclick="toggleSound(event)" aria-label="Звук"></button>
    <button class="dots-btn" onclick="openHeaderMenu(event)">⋯</button>
  </header>

  <div class="sec-row">
    <div class="sec-label">Список дежурных</div>
    <button class="copy-btn" onclick="copyCounts()" aria-label="Скопировать счётчики">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
    </button>
  </div>
  <div class="duty-list" id="dutyList"></div>

  <div class="sec-label">Пропустившие</div>
  <div class="debtors-list" id="debtorsList"></div>

  <div class="rand-wrap">
    <button class="rand-btn" id="randBtn" onclick="randomize()">Рандомайзер</button>
    <div class="rand-result" id="randResult">
      <button class="rr-close" onclick="hideRand()">✕</button>
      <div class="rr-label">Случайный пропустивший</div>
      <div class="rr-reel"><div class="rr-name" id="randName">—</div></div>
      <div class="rr-sub" id="randSub"></div>
      <div class="burst" id="randBurst"></div>
    </div>
  </div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="ov-bd" onclick="closeMenu()"></div>
  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-hdr" id="ctxHdr">ДЕЙСТВИЯ</div>
    <div id="ctxBody"></div>
  </div>
</div>

<div class="modal-bg" id="editBg" onclick="if(event.target===this)closeEdit()">
  <div class="modal">
    <div class="modal-title" id="editTitle"></div>
    <input id="editInput" type="number" inputmode="numeric" min="0" max="9999">
    <div class="modal-btns">
      <button onclick="closeEdit()">Отмена</button>
      <button class="ok" onclick="applyEdit()">Сохранить</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<audio id="easterEggTrack" src="office.mp3" preload="auto" playsinline></audio>

<script>
// ── SOUND ENGINE (Web Audio, синтезированные звуки, без файлов) ───────────────
var soundOn = (function(){
  try { var v = localStorage.getItem('duty_sound_v1'); return v === null ? true : v === '1'; }
  catch(e){ return true; }
})();
var _actx = null;
function actx(){
  if (!_actx) {
    try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
  }
  return _actx;
}
// Telegram's in-app WebView (iOS особенно) часто создаёт AudioContext в состоянии
// "suspended" и не "просыпается" от обычного resume() без явной привязки к жесту.
// Поэтому: 1) глушим контекст как можно раньше первым же касанием/кликом,
// 2) перед каждым звуком ждём, пока resume() реально завершится, и только
// потом планируем звук (иначе он тихо "проглатывается").
function ensureRunning(cb){
  var ctx = actx();
  if (!ctx) { warnNoAudio(); cb(null); return; }
  if (ctx.state === 'running') { cb(ctx); return; }
  try {
    ctx.resume().then(function(){
      if (ctx.state !== 'running') warnNoAudio();
      cb(ctx);
    }, function(){ warnNoAudio(); cb(ctx); });
  } catch(e) { warnNoAudio(); cb(ctx); }
}
function unlockAudio(){
  var ctx = actx(); if (!ctx) return;
  // немой буфер — классический трюк для разблокировки звука в WebKit/WebView
  try {
    var b = ctx.createBuffer(1, 1, 22050);
    var s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
  } catch(e) {}
  if (ctx.state === 'suspended') { try { ctx.resume(); } catch(e){} }
}
['touchstart','touchend','mousedown','pointerdown','click','keydown'].forEach(function(ev){
  document.addEventListener(ev, unlockAudio, {capture:true, passive:true});
});
function tone(o){
  if (!soundOn) return;
  ensureRunning(function(ctx){
    if (!ctx) return;
    var t0 = ctx.currentTime, dur = o.dur || 0.12;
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t0);
    if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(o.slideTo,1), t0+dur);
    var vol = o.vol != null ? o.vol : 0.1;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  });
}
function noiseBurst(o){
  if (!soundOn) return;
  ensureRunning(function(ctx){
    if (!ctx) return;
    var dur = o.dur || 0.15;
    var buf = ctx.createBuffer(1, Math.max(1,Math.round(ctx.sampleRate*dur)), ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i=0;i<data.length;i++){ data[i] = (Math.random()*2-1) * Math.pow(1-i/data.length, 2); }
    var src = ctx.createBufferSource(); src.buffer = buf;
    var filt = ctx.createBiquadFilter(); filt.type = o.filterType || 'lowpass'; filt.frequency.value = o.freq || 1200;
    var g = ctx.createGain(); g.gain.value = o.vol != null ? o.vol : 0.12;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start();
  });
}

function normalize(o) {
  if (!o || typeof o !== 'object') o = {};
  if (!o.counts || typeof o.counts !== 'object') o.counts = {};
  if (!Array.isArray(o.debtors)) o.debtors = [];
  PAIRS.forEach(function(p){

    if (o.counts[p.b] === undefined) o.counts[p.b] = 0;
  });
  return o;
}

var _ct;
function cloudPush() {
  if (!CS) return;
  clearTimeout(_ct);
  _ct = setTimeout(function(){
    var json = JSON.stringify(S);
    if (json.length > 4096) { toast('Облако: данные не влезли (>4096)'); return; } // лимит тг на значение

// у кого ts новее, тот и прав; без ts (старые данные) облако выигрывает, если оно есть
function cloudPull() {
  if (!CS) return;
  CS.getItem('duty_v5', function(err, val){
    if (err) return;
    var c = null;
    try { if (val) c = normalize(JSON.parse(val)); } catch(e) {}
    var lt = S.ts || 0;
    if (c && (c.ts || 0) > lt) {
      S = c; persistLocal(); render();
      toast('Данные подтянуты из облака');
    } else if (!c || (c.ts || 0) < lt) {
      cloudPush();
    }
  });
}

// ── SNOW (на всех экранах, редкий, белые точки) ──────────────────────────────
// во время проигрывания трека на gate плавно превращаются в 🤫, затем обратно
var _snowRun = false;
var startSnow = function(){};
var setEmojiMode = function(){};
(function(){
  var cv = document.getElementById('snow'); if (!cv) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0, flakes = [], inited = false;
  var EMOJI = '🤫'; // 🤫

  // 0 = снежинки, 1 = смайлики; плавный переход между состояниями во времени
  var emojiFrom = 0, emojiTarget = 0, emojiState = 0, emojiT0 = 0, emojiDur = 900;
  function ease(x){ return x<0?0:x>1?1:(1-Math.pow(1-x,3)); }
  setEmojiMode = function(target){
    emojiFrom = emojiState; emojiTarget = target; emojiT0 = performance.now();
    if (!_snowRun) startSnow();
  };

  function size(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function mk(initial){
    return { x:Math.random()*W, y:initial?Math.random()*H:-6, r:0.8+Math.random()*1.5,
             v:0.25+Math.random()*0.55, a:0.35+Math.random()*0.55, ph:Math.random()*6.28, sw:0.2+Math.random()*0.5 };
  }
  function tick(t){
    if (document.hidden) { _snowRun = false; return; } // экономим батарею, пока апп свёрнут
    var prog = emojiDur > 0 ? (t - emojiT0) / emojiDur : 1;
    emojiState = emojiFrom + (emojiTarget - emojiFrom) * ease(prog);
    var em = emojiState;
    ctx.clearRect(0,0,W,H);
    for (var i=0;i<flakes.length;i++){
      var f = flakes[i];
      f.y += f.v; f.x += Math.sin(t/1500 + f.ph) * f.sw * 0.6;
      if (f.y > H+6) { flakes[i] = f = mk(false); }
      if (em < 0.995) {
        ctx.globalAlpha = f.a * (1 - em);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
      }
      if (em > 0.005) {
        ctx.globalAlpha = f.a * em;
        ctx.font = Math.max(10, f.r*9)+'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(EMOJI, f.x, f.y);
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  startSnow = function(){
    if (!inited) {
      inited = true; size();
      var N = Math.round(Math.min(45, Math.max(24, W*H/9000)));
      for (var i=0;i<N;i++) flakes.push(mk(true));
      window.addEventListener('resize', size);
    }
    if (!_snowRun) { _snowRun = true; requestAnimationFrame(tick); }
  };
  startSnow();
})();

var _subOpen = false;

function posMenu(e) {
  var menu = document.getElementById('ctxMenu');
  var btn  = e.currentTarget;
  var rect = btn.getBoundingClientRect();
  var vw = window.innerWidth, vh = window.innerHeight;
  menu.style.top=menu.style.bottom=menu.style.left=menu.style.right='';
  var top   = rect.bottom + 6;
  var right = vw - rect.right + 4;
  if (top + 300 > vh) { menu.style.bottom = (vh - rect.top + 6)+'px'; }
  else                { menu.style.top    = top+'px'; }
  if (right < 8) right = 8;
  menu.style.right = right+'px';
}

function showMenu() {
  document.getElementById('overlay').classList.add('active');
  requestAnimationFrame(function(){
    document.getElementById('ctxMenu').classList.add('open');
  });
}

function closeMenu() {
  var wasOpen = document.getElementById('overlay').classList.contains('active');
  document.getElementById('ctxMenu').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
  _subOpen = false;
  if (wasOpen) sfx.close();

function buildMenu(headerText, items) {
  document.getElementById('ctxMenu').classList.remove('wide');
  document.getElementById('ctxHdr').textContent = headerText;
  var body = document.getElementById('ctxBody');
  body.innerHTML = '';
  _subOpen = false;

  items.forEach(function(item) {

      trigger.innerHTML = '<span>✓</span> '+item.label;

        si.className = 'sub-item';
        si.textContent = c.label;
        si.onclick = c.fn;
        subEl.appendChild(si);
      });

      body.appendChild(subEl);
    } else {
      var div = document.createElement('div');
      div.className = 'ctx-item '+(item.cls||'');
      div.innerHTML = '<span>'+(item.icon||'')+'</span> '+item.label;
      div.onclick = item.fn;
      body.appendChild(div);

// строка человека: число + «+» «−» «✕». меню не закрывается, жми сколько надо
function pairPersonRow(pairId, name, slot) {
  var row = document.createElement('div'); row.className = 'p-row';
  var nm  = document.createElement('span'); nm.className = 'p-name'; nm.textContent = name;
  var cnt = document.createElement('span'); cnt.className = 'p-cnt';
  function upd(){ cnt.textContent = S.counts[name] || 0; }
  function btn(cls, txt, fn){
    var b = document.createElement('button'); b.className = 'p-btn '+cls; b.textContent = txt;
    b.onclick = function(ev){ ev.stopPropagation(); fn(); };
    return b;
  }
  row.appendChild(nm); row.appendChild(cnt);
  row.appendChild(btn('plus', '+', function(){
    S.counts[name] = (S.counts[name] || 0) + 1; save(); render(); upd(); sfx.plus();
  }));
  row.appendChild(btn('minus', '\u2212', function(){
    if ((S.counts[name] || 0) > 0) { S.counts[name]--; save(); render(); upd(); sfx.minus(); }
  }));
  row.appendChild(btn('x', '\u2715', function(){
    if (addDebtor(name, pairId, slot)) { save(); render(); toast(name+' — в пропустившие'); sfx.remove(); }
    else { toast(name+' уже в пропустивших'); sfx.warning(); }
  }));
  upd();
  return row;
}

function openPairMenu(e, id) {
  e.stopPropagation();
  sfx.open();
  var p = PAIRS.filter(function(x){ return x.id===id; })[0];
  posMenu(e);
  buildMenu('Пара '+id, []);
  document.getElementById('ctxMenu').classList.add('wide');
  var body = document.getElementById('ctxBody');
  body.appendChild(pairPersonRow(id, p.a, 'a'));
  body.appendChild(pairPersonRow(id, p.b, 'b'));
  showMenu();
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function markDebtorDone(idx) {
  var d = S.debtors[idx];
  S.counts[d.name] = (S.counts[d.name]||0)+1;
  S.debtors.splice(idx,1);
  save(); render();
  toast(d.name+' — отдежурил ✓');
}

// просто убрать из пропустивших, без +1 к счётчику
function deleteDebtor(idx) {
  var d = S.debtors[idx];
  S.debtors.splice(idx,1);
  save(); render();
  toast(d.name+' — удалён из пропустивших');
}

function addDebtor(name,pairId,slot){
  var exists = S.debtors.filter(function(d){ return d.name===name&&d.pairId===pairId; }).length>0;
  if (!exists) S.debtors.push({name:name,pairId:pairId,slot:slot});
  return !exists;
}

// стереть всё: счётчики в ноль и список пропустивших пустой
function doResetAll(){
  S={ debtors:[], counts:defaultCounts() };
  save(); render(); hideRand();
  toast('Всё стёрто');
}

// ── RANDOMIZER ────────────────────────────────────────────────────────────────
var _randBusy = false, _randT = null;

function haptic(kind) {
  try {
    var h = TG && TG.HapticFeedback; if (!h) return;
    if (kind === 'done') h.notificationOccurred('success'); else h.impactOccurred('light');
  } catch(e) {}
}

// прокрутка фамилий пропустивших с замедлением, потом посадка на выбранного пропустившего
function randomize(){
  if (_randBusy) return;
  if (!S.debtors.length){ toast('Пропустивших нет'); sfx.warning(); return; }
  sfx.open();
  var pick = S.debtors[Math.floor(Math.random()*S.debtors.length)];
  var pair = PAIRS.filter(function(p){ return p.id===pick.pairId; })[0];
  var res = document.getElementById('randResult');
  var nameEl = document.getElementById('randName');
  var subEl  = document.getElementById('randSub');
  var btn = document.getElementById('randBtn');
  var names = S.debtors.map(function(d){ return d.name; }); // крутим только пропустивших

  res.classList.remove('done'); res.classList.add('show');
  subEl.classList.remove('in'); subEl.textContent = '';
  nameEl.classList.remove('land');
  _randBusy = true; btn.disabled = true;

  var steps = 18, i = 0, last = '';
  function step(){
    if (i >= steps) { land(); return; }
    var t = i / steps, delay = 50 + Math.pow(t, 2.4) * 230;
    var nm; do { nm = names[Math.floor(Math.random()*names.length)]; } while (nm === last && names.length > 1);
    last = nm; nameEl.textContent = nm;
    nameEl.classList.remove('tick'); void nameEl.offsetWidth;
    nameEl.style.animationDuration = Math.round(delay*0.85)+'ms'; nameEl.classList.add('tick');
    haptic('tick'); sfx.reelTick();
    i++; _randT = setTimeout(step, delay);
  }
  function land(){
    nameEl.classList.remove('tick'); nameEl.style.animationDuration = '';
    void nameEl.offsetWidth;
    nameEl.textContent = pick.name; nameEl.classList.add('land');
    subEl.textContent = 'пара '+pick.pairId+' · '+pair.a+' & '+pair.b; subEl.classList.add('in');
    void res.offsetWidth; res.classList.add('done');
    burst(); haptic('done'); sfx.land();
    _randBusy = false; btn.disabled = false;
  }
  step();
}

function burst(){
  var box = document.getElementById('randBurst'); box.innerHTML = '';
  for (var i=0;i<16;i++){
    var sp = document.createElement('span'); sp.className = 'spark';
    var a = (i/16)*6.2832 + Math.random()*0.4, d = 55 + Math.random()*45;
    sp.style.setProperty('--dx', Math.round(Math.cos(a)*d)+'px');
    sp.style.setProperty('--dy', Math.round(Math.sin(a)*d*0.6)+'px');
    sp.style.background = (i%3===0) ? '#ef5350' : '#fff';
    box.appendChild(sp);
  }
  setTimeout(function(){ box.innerHTML = ''; }, 900);
}

function hideRand(){
  clearTimeout(_randT); _randBusy = false;
  var b = document.getElementById('randBtn'); if (b) b.disabled = false;
  document.getElementById('randResult').classList.remove('show','done');
  sfx.close();
}

// ── EDIT COUNT ────────────────────────────────────────────────────────────────
var _editName = null;
function openEdit(name) {
  sfx.open();
  _editName = name;
  document.getElementById('editTitle').textContent = name + ' — число дежурств';
  var inp = document.getElementById('editInput');
  inp.value = S.counts[name] || 0;
  document.getElementById('editBg').classList.add('show');
  setTimeout(function(){ inp.focus(); inp.select(); }, 50);
}
function closeEdit() {
  document.getElementById('editBg').classList.remove('show');
  _editName = null;
  sfx.close();
}
function applyEdit() {
  var v = parseInt(document.getElementById('editInput').value, 10);
  if (isNaN(v) || v < 0 || v > 9999) { toast('Введи число от 0 до 9999'); sfx.warning(); return; }
  var name = _editName;
  S.counts[name] = v;
  save(); render(); closeEdit();
  toast(name + ': ' + v);
  sfx.copy();
}
document.getElementById('editInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') applyEdit();
});

// ── COPY COUNTS ───────────────────────────────────────────────────────────────
function copyCounts() {
  var lines = [];
  PAIRS.forEach(function(p){
    lines.push(p.a + ' - ' + (S.counts[p.a] || 0));
    lines.push(p.b + ' - ' + (S.counts[p.b] || 0));
  });
  var text = lines.join('\n');
  function ok(){ toast('Счётчики скопированы'); haptic('done'); sfx.copy(); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var r = false; try { r = document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    if (r) ok(); else { toast('Не удалось скопировать'); sfx.warning(); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
var _tt;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(function(){ t.classList.remove('show'); },2400);
}

// ── TG SDK ────────────────────────────────────────────────────────────────────
if (TG) {
  TG.ready();
  TG.expand();
}
updateSoundBtn();
checkAccess();
document.addEventListener('visibilitychange', function(){
  if (document.hidden) return;
  startSnow();
  if (_owner) cloudPull();
});
</script>
